<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agile Coach Assessment</title>
<style>
/* Mismo lenguaje visual que ClaudeExamSim: paleta oklch, fuentes del sistema (sin dependencias),
   esquinas rectas, líneas finas, acento usado con moderación. */
:root {
  --bg: oklch(0.10 0 0);
  --panel: oklch(0.14 0.005 60);
  --panel2: oklch(0.175 0.005 60);
  --fg: oklch(0.96 0 0);
  --muted: oklch(0.62 0.01 60);
  --dim: oklch(0.40 0.01 60);
  --line: oklch(0.22 0.005 60);
  --line-soft: oklch(0.17 0.005 60);
  --accent: oklch(0.72 0.15 45);
  --accent-wash: color-mix(in oklab, var(--accent) 10%, transparent);
  --ok: oklch(0.72 0.15 155);
  --ok-wash: color-mix(in oklab, var(--ok) 12%, transparent);
  --bad: oklch(0.64 0.19 25);
  --bad-wash: color-mix(in oklab, var(--bad) 12%, transparent);
  --warn: oklch(0.80 0.14 85);
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  --max-w: 960px;
  color-scheme: dark;
}
:root[data-theme="light"] {
  --bg: oklch(0.97 0.004 80);
  --panel: oklch(0.99 0.003 80);
  --panel2: oklch(0.95 0.004 80);
  --fg: oklch(0.21 0.01 60);
  --muted: oklch(0.46 0.02 60);
  --dim: oklch(0.62 0.02 60);
  --line: oklch(0.84 0.008 70);
  --line-soft: oklch(0.9 0.006 70);
  --accent: oklch(0.58 0.18 42);
  --ok: oklch(0.55 0.14 155);
  --bad: oklch(0.55 0.19 25);
  --warn: oklch(0.62 0.14 75);
  color-scheme: light;
}
*, *::before, *::after { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font-family: var(--sans); font-size: 15px; line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}
::selection { background: var(--accent); color: var(--bg); }
button, input, select { font: inherit; color: inherit; }
a { color: var(--accent); }

.wrap { max-width: var(--max-w); margin: 0 auto; padding: 0 16px; }
header.top {
  border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 10;
  background: color-mix(in oklab, var(--bg) 92%, transparent); backdrop-filter: blur(8px);
}
header.top .wrap { display: flex; align-items: center; gap: 12px; min-height: 56px; flex-wrap: wrap; }
.brand { font-weight: 600; letter-spacing: -.01em; cursor: pointer; display: flex; align-items: center; gap: 10px; }
.brand .dot { width: 10px; height: 10px; background: var(--accent); display: inline-block; }
.brand small { font-family: var(--mono); color: var(--muted); font-weight: 400; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; }
.spacer { flex: 1; }
.mono { font-family: var(--mono); }
.eyebrow { font-family: var(--mono); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
h1 { font-size: clamp(26px, 4.5vw, 40px); line-height: 1.1; letter-spacing: -.025em; margin: 8px 0 12px; font-weight: 600; }
h2 { font-size: 20px; letter-spacing: -.015em; margin: 0 0 12px; font-weight: 600; }
h3 { font-size: 15px; margin: 0 0 8px; font-weight: 600; }
p.lead { color: var(--muted); max-width: 62ch; margin: 0 0 8px; }
main { padding: 28px 0 80px; }

.card { background: var(--panel); border: 1px solid var(--line); padding: 20px; }
.card + .card { margin-top: 16px; }
.grid2 { display: grid; grid-template-columns: 1.1fr 1fr; gap: 16px; }
@media (max-width: 760px) { .grid2 { grid-template-columns: 1fr; } }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  border: 1px solid var(--line); background: var(--panel2); padding: 9px 16px; cursor: pointer;
  font-size: 14px; font-weight: 500; transition: border-color .15s, background .15s; text-decoration: none; color: var(--fg);
}
.btn:hover { border-color: var(--muted); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: oklch(0.15 0 0); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.ghost { background: transparent; }
.btn.danger { color: var(--bad); }
.btn.sm { padding: 5px 10px; font-size: 13px; }
.btn.on { border-color: var(--warn); color: var(--warn); }

label.field { display: block; margin-bottom: 18px; }
label.field > span { display: block; margin-bottom: 6px; font-size: 13px; color: var(--muted); }
input[type=text] {
  width: 100%; padding: 11px 12px; background: var(--bg); border: 1px solid var(--line); outline: none; font-size: 16px;
}
input[type=text]:focus { border-color: var(--accent); }
input[type=range] { width: 100%; accent-color: var(--accent); }
.range-row { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.big { font-size: 34px; font-weight: 600; letter-spacing: -.02em; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-family: var(--mono); font-size: 11px; border: 1px solid var(--line); padding: 3px 8px; color: var(--muted); }
.chip.acc { color: var(--accent); border-color: color-mix(in oklab, var(--accent) 45%, var(--line)); }
.chip.ok { color: var(--ok); border-color: color-mix(in oklab, var(--ok) 45%, var(--line)); }
.chip.bad { color: var(--bad); border-color: color-mix(in oklab, var(--bad) 45%, var(--line)); }
.dimlist { list-style: none; padding: 0; margin: 0; }
.dimlist li { display: flex; justify-content: space-between; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line-soft); font-size: 14px; }
.dimlist li:last-child { border-bottom: 0; }
.banner { border: 1px solid color-mix(in oklab, var(--warn) 50%, var(--line)); background: color-mix(in oklab, var(--warn) 8%, transparent); padding: 14px 16px; margin-bottom: 16px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.banner .spacer { min-width: 10px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }

/* Examen */
.exambar { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.timer { font-family: var(--mono); font-size: 20px; font-weight: 500; padding: 4px 10px; border: 1px solid var(--line); }
.timer.warn { color: var(--warn); border-color: var(--warn); }
.timer.crit { color: var(--bad); border-color: var(--bad); animation: pulse 1s infinite; }
@keyframes pulse { 50% { opacity: .55; } }
.progress { height: 3px; background: var(--line); }
.progress > i { display: block; height: 100%; background: var(--accent); transition: width .25s; }
.qhead { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
.qtext { font-size: 18px; line-height: 1.5; margin: 0 0 18px; font-weight: 500; }
.opts { display: grid; gap: 8px; }
.opt {
  display: flex; gap: 12px; align-items: flex-start; text-align: left; width: 100%;
  padding: 13px 14px; border: 1px solid var(--line); background: var(--bg); cursor: pointer; transition: border-color .12s, background .12s;
}
.opt:hover { border-color: var(--muted); }
.opt .key { font-family: var(--mono); font-size: 12px; min-width: 24px; height: 24px; display: inline-flex; align-items: center; justify-content: center; border: 1px solid var(--line); color: var(--muted); flex-shrink: 0; }
.opt.multi .key { border-radius: 0; }
.opt.single .key { border-radius: 50%; }
.opt.sel { border-color: var(--accent); background: var(--accent-wash); }
.opt.sel .key { background: var(--accent); border-color: var(--accent); color: oklch(0.15 0 0); }
.hint { min-height: 20px; font-size: 13px; color: var(--warn); margin-top: 10px; }
.navrow { display: flex; gap: 10px; margin-top: 18px; flex-wrap: wrap; }
.qmap { display: grid; grid-template-columns: repeat(auto-fill, minmax(36px, 1fr)); gap: 6px; }
.qmap button { height: 34px; border: 1px solid var(--line); background: var(--bg); cursor: pointer; font-family: var(--mono); font-size: 12px; position: relative; }
.qmap button.ans { background: var(--panel2); border-color: var(--muted); }
.qmap button.cur { border-color: var(--accent); color: var(--accent); }
.qmap button.flag::after { content: ""; position: absolute; top: 3px; right: 3px; width: 6px; height: 6px; background: var(--warn); }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); margin-top: 10px; }
.legend i { display: inline-block; width: 10px; height: 10px; border: 1px solid var(--line); margin-right: 5px; vertical-align: -1px; }

/* Resultados */
.score { display: flex; gap: 28px; flex-wrap: wrap; align-items: flex-end; }
.score .pct { font-size: 64px; font-weight: 600; letter-spacing: -.04em; line-height: 1; }
.kv { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); margin-top: 18px; }
.kv > div { background: var(--panel); padding: 12px 14px; }
.kv b { display: block; font-size: 20px; font-weight: 600; }
.verdict { font-family: var(--mono); font-size: 12px; letter-spacing: .1em; text-transform: uppercase; padding: 5px 10px; border: 1px solid; }
.verdict.pass { color: var(--ok); border-color: var(--ok); background: var(--ok-wash); }
.verdict.fail { color: var(--bad); border-color: var(--bad); background: var(--bad-wash); }
.bars { display: grid; gap: 14px; }
.bar .lbl { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; margin-bottom: 5px; }
.bar .track { height: 10px; background: var(--line-soft); border: 1px solid var(--line); position: relative; }
.bar .track > i { display: block; height: 100%; }
.bar .track::after { content: ""; position: absolute; top: -3px; bottom: -3px; left: 70%; width: 1px; background: var(--muted); opacity: .7; }
svg text { fill: var(--muted); font-family: var(--mono); font-size: 10px; }
svg .grid { stroke: var(--line); fill: none; }
svg .area { fill: var(--accent-wash); stroke: var(--accent); stroke-width: 2; }
svg .pt { fill: var(--accent); }
.chart-wrap { width: 100%; overflow: hidden; }
.chart-wrap svg { width: 100%; height: auto; display: block; }

.filters { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; align-items: center; }
.filters .btn.act { border-color: var(--accent); color: var(--accent); }
select { background: var(--bg); border: 1px solid var(--line); padding: 7px 10px; }
.rev { border: 1px solid var(--line); border-left-width: 3px; padding: 16px; background: var(--panel); }
.rev + .rev { margin-top: 10px; }
.rev.ok { border-left-color: var(--ok); }
.rev.bad { border-left-color: var(--bad); }
.rev .q { font-weight: 500; margin: 8px 0 12px; }
.rev ul { list-style: none; padding: 0; margin: 0 0 12px; display: grid; gap: 5px; }
.rev li { padding: 8px 10px; border: 1px solid var(--line-soft); font-size: 14px; display: flex; gap: 10px; }
.rev li .m { font-family: var(--mono); width: 16px; flex-shrink: 0; }
.rev li.correct { border-color: color-mix(in oklab, var(--ok) 50%, var(--line)); background: var(--ok-wash); }
.rev li.wrong { border-color: color-mix(in oklab, var(--bad) 50%, var(--line)); background: var(--bad-wash); }
.rev li .tag { margin-left: auto; font-family: var(--mono); font-size: 11px; color: var(--muted); white-space: nowrap; }
.expl { font-size: 14px; color: var(--muted); border-top: 1px dashed var(--line); padding-top: 10px; }
.expl b { color: var(--fg); font-weight: 600; }

table { width: 100%; border-collapse: collapse; font-size: 14px; }
th, td { text-align: left; padding: 9px 8px; border-bottom: 1px solid var(--line-soft); }
th { font-family: var(--mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 400; }
.tscroll { overflow-x: auto; }
.coachgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
.coachcard { border: 1px solid var(--line); background: var(--bg); padding: 14px; cursor: pointer; text-align: left; }
.coachcard:hover, .coachcard.act { border-color: var(--accent); }
.coachcard b { display: block; font-size: 15px; margin-bottom: 4px; }

.modal-bg { position: fixed; inset: 0; background: rgb(0 0 0 / .55); display: flex; align-items: center; justify-content: center; z-index: 50; padding: 16px; }
.modal { background: var(--panel); border: 1px solid var(--line); padding: 22px; max-width: 460px; width: 100%; }
.modal .row { justify-content: flex-end; margin-top: 18px; }
.empty { padding: 30px; text-align: center; color: var(--muted); border: 1px dashed var(--line); }
.hide { display: none !important; }

@media (max-width: 560px) {
  header.top .wrap { flex-wrap: nowrap; gap: 8px; }
  .brand small, #topbar .coachname, .brand .full { display: none; }
  #topbar { flex-wrap: nowrap; gap: 6px; }
  #topbar .btn.sm { padding: 5px 8px; }
  .qtext { font-size: 16px; }
  .score .pct { font-size: 48px; }
  .timer { font-size: 17px; }
}
@media print {
  header.top, .noprint, .filters { display: none !important; }
  body { background: #fff; color: #000; }
  .card, .rev { break-inside: avoid; }
}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="brand" id="brand" title="Inicio"><span class="dot"></span>Agile Coach<span class="full">&nbsp;Assessment</span> <small>examen</small></div>
    <div class="spacer"></div>
    <div id="topbar" class="row"></div>
    <button class="btn ghost sm noprint" id="themeBtn" title="Cambiar tema">◐</button>
  </div>
</header>
<main><div class="wrap" id="app"></div></main>

<script>
/* ============================================================================
   BANCO DE PREGUNTAS
   d: dimensión · t: 's' (respuesta única) | 'm' (respuesta múltiple)
   o: opciones · a: índices correctos (sobre o) · e: explicación
   Las opciones se barajan al armar cada examen; los índices se guardan contra el
   orden original, así que reordenar el arreglo de opciones aquí rompería el historial.
   Para agregar preguntas, sumar objetos con un id nuevo y único.
   ========================================================================== */
const DIMS = [
  { id: 'fw',     name: 'Frameworks de trabajo ágil',                    short: 'Frameworks',   kind: 'Requerido' },
  { id: 'okr',    name: 'Técnicas de OKRs',                               short: 'OKRs',         kind: 'Requerido' },
  { id: 'tools',  name: 'Herramientas de gestión',                        short: 'Herramientas', kind: 'Requerido' },
  { id: 'met',    name: 'Métricas organizacionales y de equipos',         short: 'Métricas',     kind: 'Requerido' },
  { id: 'coach',  name: 'Coaching y mentoring de equipos',                short: 'Coaching',     kind: 'Requerido' },
  { id: 'o365',   name: 'Microsoft Office 365',                           short: 'Office 365',   kind: 'Requerido' },
  { id: 'disc',   name: 'Descubrimiento de producto',                     short: 'Discovery',    kind: 'Requerido' },
  { id: 'devops', name: 'DevOps',                                         short: 'DevOps',       kind: 'Recomendable' },
  { id: 'scale',  name: 'Squads, tribus, chapters, CoE y foros (modelo BCG)', short: 'Tribus y squads', kind: 'Recomendable' }
];

const BANK = [
/* ---------------- Frameworks de trabajo ágil ---------------- */
{ id:'FW01', d:'fw', t:'s', q:'Según la Guía Scrum 2020, ¿cuál es el compromiso asociado al Product Backlog?',
  o:['El Objetivo del Producto (Product Goal)','La Definición de Hecho (Definition of Done)','El Objetivo del Sprint (Sprint Goal)','La Definición de Preparado (Definition of Ready)'],
  a:[0], e:'Cada artefacto tiene un compromiso: Product Backlog → Objetivo del Producto; Sprint Backlog → Objetivo del Sprint; Incremento → Definición de Hecho. La Definition of Ready no forma parte de la Guía Scrum.' },
{ id:'FW02', d:'fw', t:'s', q:'A mitad del Sprint, el Product Owner pide incorporar un ítem urgente que pondría en riesgo el Sprint Goal. ¿Qué es lo más coherente con la Guía Scrum?',
  o:['El PO lo agrega directamente, ya que es quien ordena el Sprint Backlog y responde por el valor','No se hacen cambios que pongan en riesgo el Sprint Goal; si el objetivo quedó obsoleto, el PO puede cancelar el Sprint','Los Developers lo incorporan y renegocian el Sprint Goal con el Scrum Master para reflejar el cambio','Se agrega al Sprint Backlog y se extiende la duración del Sprint lo necesario para cumplir el Sprint Goal'],
  a:[1], e:'Durante el Sprint no se hacen cambios que pongan en peligro el Sprint Goal; el alcance puede renegociarse con el PO a medida que se aprende. El Sprint Backlog pertenece a los Developers, la duración del Sprint no se extiende y sólo el PO puede cancelar un Sprint.' },
{ id:'FW03', d:'fw', t:'m', q:'Los CoEs gestionan su trabajo con el método Kanban. ¿Cuáles de estas son prácticas centrales del método?',
  o:['Limitar el trabajo en progreso mediante un sistema pull','Hacer explícitas las políticas del proceso','Implementar circuitos de retroalimentación','Mejorar y evolucionar colaborativamente','Comprometer un objetivo por iteración de duración fija','Estimar cada ítem con Planning Poker antes de tomarlo'],
  a:[0,1,2,3], e:'El método Kanban se apoya en seis prácticas centrales: visualizar el flujo, limitar el WIP (sistema pull), hacer explícitas las políticas, gestionar el flujo, circuitos de retroalimentación y mejorar colaborativamente. Los objetivos por iteración y Planning Poker son prácticas de Scrum.' },
{ id:'FW04', d:'fw', t:'s', q:'Un equipo tiene en promedio 12 ítems en curso (WIP) y un throughput de 4 ítems por semana. Según la Ley de Little, ¿cuál es su cycle time promedio aproximado?',
  o:['3 semanas','48 semanas','0,33 semanas','16 semanas'],
  a:[0], e:'Ley de Little: Cycle Time promedio = WIP promedio / Throughput promedio = 12 / 4 = 3 semanas. Por eso reducir el WIP es la palanca más directa para bajar el cycle time.' },
{ id:'FW05', d:'fw', t:'s', q:'¿Cuál es el propósito de la Sprint Review según la Guía Scrum 2020?',
  o:['Demostrar el incremento a los stakeholders para obtener su aceptación formal del trabajo realizado','Inspeccionar el resultado del Sprint con los stakeholders y determinar adaptaciones futuras','Inspeccionar cómo fue el Sprint en cuanto a personas, interacciones, procesos y herramientas','Revisar el avance hacia el Sprint Goal y ajustar el Sprint Backlog para lo que resta del Sprint'],
  a:[1], e:'La Review es una sesión de trabajo para inspeccionar el resultado y adaptar el Product Backlog; no es una "puerta de aceptación". Inspeccionar personas y procesos corresponde a la Retrospectiva, y ajustar el Sprint Backlog hacia el Sprint Goal, a la Daily.' },
{ id:'FW06', d:'fw', t:'s', q:'En Extreme Programming (XP), ¿qué práctica busca que cualquier pareja pueda modificar cualquier parte del código cuando lo necesite?',
  o:['Propiedad colectiva del código','Programación en pareja','Integración continua','Estándares de codificación'],
  a:[0], e:'La propiedad colectiva del código elimina los "dueños" de módulos. Se apoya en la programación en pareja, los estándares de codificación y las pruebas automatizadas, pero la práctica que habilita modificar cualquier parte es la propiedad colectiva.' },
{ id:'FW07', d:'fw', t:'m', q:'Un equipo tiene muchos ítems "casi terminados" y sus miembros alternan entre 4 o 5 tareas a la vez. ¿Qué desperdicios Lean del desarrollo de software (Poppendieck) se evidencian en esta situación?',
  o:['Trabajo parcialmente hecho','Cambio de tareas (task switching)','Funcionalidades extra','Traspasos (handoffs)'],
  a:[0,1], e:'Los siete desperdicios de Poppendieck son: trabajo parcialmente hecho, funcionalidades extra, reaprendizaje, traspasos, cambio de tareas, demoras y defectos. La situación describe trabajo parcialmente hecho y cambio de tareas; nada indica funcionalidades extra ni traspasos.' },
{ id:'FW08', d:'fw', t:'s', q:'¿Cuál de las siguientes afirmaciones es uno de los 12 principios del Manifiesto Ágil?',
  o:['La medida principal de progreso es el cumplimiento del plan de entregas acordado con el cliente','La simplicidad, o el arte de maximizar la cantidad de trabajo no realizado, es esencial','Los procesos ágiles promueven el desarrollo sostenible gracias a una planificación detallada temprana','El método más eficiente de comunicar información al equipo es la documentación compartida'],
  a:[1], e:'El principio de simplicidad es literal. Los otros distorsionan principios reales: la medida principal de progreso es el software funcionando, el desarrollo sostenible no depende de planificar en detalle, y el método más eficiente de comunicación es la conversación cara a cara.' },
{ id:'FW09', d:'fw', t:'s', q:'Tres Scrum Teams trabajan sobre el mismo producto y cada uno tiene su propia Definición de Hecho. ¿Qué indica la Guía Scrum?',
  o:['Cada equipo puede mantener su DoD siempre que cumpla el estándar mínimo de la organización','Deben definir y cumplir mutuamente una misma Definición de Hecho','La define el Product Owner, porque es quien acepta el incremento del producto','Cada equipo mantiene su DoD y se agrega una DoD de integración a cargo de un equipo'],
  a:[1], e:'La Guía Scrum 2020 establece que si varios Scrum Teams trabajan en el mismo producto, deben definir y cumplir mutuamente la misma DoD. El estándar de la organización es el mínimo, pero no reemplaza esa DoD común.' },
{ id:'FW10', d:'fw', t:'s', q:'Un gerente asiste a todas las Daily Scrum y pide a cada persona un reporte de estado. ¿Cuál es la intervención más adecuada como Agile Coach?',
  o:['Pedirle que no asista más, ya que la Guía Scrum prohíbe la presencia de personas ajenas al Scrum Team','Devolver la Daily a los Developers con foco en el Sprint Goal y ayudar al gerente a obtener visibilidad por otros medios','Mantener el formato de reporte pero limitarlo a 15 minutos para respetar el timebox del evento','Pedir al Scrum Master que consolide el estado de cada persona y se lo envíe al gerente luego de la Daily'],
  a:[1], e:'La Daily es de los Developers para inspeccionar el progreso hacia el Sprint Goal. La Guía 2020 no prohíbe explícitamente la asistencia de otros; el coach atiende la necesidad real del gerente (visibilidad) mediante artefactos transparentes y la Review, sin convertir la Daily en un reporte.' },
{ id:'FW11', d:'fw', t:'s', q:'En la Guía Kanban, ¿qué es una Service Level Expectation (SLE)?',
  o:['Un compromiso con el cliente sobre el tiempo máximo de entrega, con consecuencias si no se cumple','Un pronóstico de cuánto debería tardar un ítem en completarse, con un período y una probabilidad','El cycle time promedio histórico del equipo, usado como meta de mejora para el siguiente período','El tiempo máximo que un ítem puede permanecer en una columna antes de escalarse como bloqueo'],
  a:[1], e:'La SLE es un pronóstico (por ejemplo, "85% de los ítems en 8 días o menos") basado en el cycle time histórico. No es un SLA contractual, no se basa en el promedio ni es un límite por columna.' },
{ id:'FW12', d:'fw', t:'s', q:'Un equipo pide pasar a Sprints de 6 semanas porque "nunca le alcanza el tiempo". ¿Cuál es la mejor respuesta?',
  o:['Aceptarlo, siempre que la duración se mantenga constante durante toda la vida del producto','Recordar que los Sprints duran un mes o menos y explorar las causas: ítems grandes, dependencias, WIP alto','Aceptarlo de forma temporal y volver a 2 semanas cuando el equipo haya ganado madurez','Mantener la duración y mover automáticamente lo no terminado al siguiente Sprint'],
  a:[1], e:'La Guía Scrum fija los Sprints en un mes o menos para limitar el riesgo y acelerar el feedback. Alargarlos o arrastrar trabajo esconde el problema; el coach ayuda a encontrar la causa raíz.' },
{ id:'FW13', d:'fw', t:'m', q:'¿Cuáles son las responsabilidades (accountabilities) que define la Guía Scrum 2020 dentro del Scrum Team?',
  o:['Product Owner','Scrum Master','Developers','Development Team (Equipo de Desarrollo)','Product Manager'],
  a:[0,1,2], e:'La Guía 2020 define Product Owner, Scrum Master y Developers. El "Development Team" era el término de la Guía 2017 y fue reemplazado para reforzar la idea de un único Scrum Team.' },
{ id:'FW14', d:'fw', t:'s', q:'¿Cuál de los siguientes NO es un valor de Scrum?',
  o:['Compromiso','Coraje','Transparencia','Foco'],
  a:[2], e:'Los valores de Scrum son compromiso, foco, apertura, respeto y coraje. La transparencia es uno de los tres pilares del empirismo, junto con la inspección y la adaptación.' },
{ id:'FW15', d:'fw', t:'s', q:'Según el marco Cynefin, ¿en qué dominio el enfoque recomendado es "sondear, percibir, responder" y los marcos empíricos como Scrum resultan más útiles?',
  o:['Claro','Complicado','Complejo','Caótico'],
  a:[2], e:'En el dominio complejo la relación causa-efecto sólo se entiende en retrospectiva, por eso se experimenta en ciclos cortos. En lo complicado se aplica análisis experto (percibir-analizar-responder) y en lo caótico se actúa primero (actuar-percibir-responder).' },
{ id:'FW16', d:'fw', t:'s', q:'En el modelo operativo de los squads, ¿cómo se define el Refinamiento del Product Backlog?',
  o:['Es un evento oficial de Scrum de 2 horas que se realiza al final de cada sprint','Es una práctica recomendada, no un evento oficial de Scrum, de máximo 10% del sprint y al menos una vez por sprint','Es una actividad exclusiva del Product Owner, que llega al Sprint Planning con los ítems ya detallados','Es una sesión trimestral que se realiza durante el Big Room Planning'],
  a:[1], e:'El playbook define el refinamiento como una práctica recomendada (no forma parte de los eventos oficiales de Scrum): una o dos sesiones por sprint (mínimo una), con un time-box de hasta el 10% del sprint, para detallar y ajustar los PBIs de los próximos 2–3 sprints junto a los Developers.' },
{ id:'FW17', d:'fw', t:'s', q:'Al introducir Kanban en un CoE con STATIK (Systems Thinking Approach to Introducing Kanban), ¿cuál es el primer paso?',
  o:['Diseñar el tablero y definir los límites de WIP de cada columna','Identificar el propósito del sistema: ¿para qué hacemos lo que hacemos?','Analizar la demanda: qué trabajo se recibe, por qué medios y con qué frecuencia','Modelar el flujo de trabajo para cada tipo de trabajo'],
  a:[1], e:'STATIK tiene 8 pasos: propósito del sistema, fuentes de insatisfacción, análisis de la demanda, capacidad actual, modelado del flujo, clases de servicio, diseño del sistema Kanban y socialización del tablero. Diseñar el tablero llega recién al final.' },
{ id:'FW18', d:'fw', t:'s', q:'¿En qué momentos se utiliza la Definition of Ready (DoR) de un squad?',
  o:['Al terminar cada historia, para que el PO decida si la acepta como terminada','En el refinamiento, para identificar historias listas, y en el Sprint Planning, para aceptarlas','En la Sprint Review, para validar con los stakeholders que el incremento está listo','Sólo durante el Inception, ya que luego la reemplaza la Definition of Done del squad'],
  a:[1], e:'La DoR es un checklist construido por todo el squad (facilitado por el SM): se usa en el refinamiento para identificar historias "listas" y en el Sprint Planning para aceptar su ingreso. La aceptación de una historia terminada depende de la DoD.' },
{ id:'FW19', d:'fw', t:'s', q:'Con sprints de 2 semanas, ¿qué time-box define el modelo operativo para Sprint Planning, Sprint Review y Retrospectiva, respectivamente?',
  o:['2 h, 1 h y 1 h','4 h, 2 h y 1,5 h','8 h, 4 h y 3 h','4 h, 3 h y 2 h'],
  a:[1], e:'Para sprints de 2 semanas: Sprint Planning de máximo 4 h, Sprint Review de máximo 2 h, Retrospectiva de máximo 1,5 h y Daily de 15 min. Son proporcionales a los máximos de la Guía Scrum para sprints de un mes (8 h, 4 h y 3 h).' },

/* ---------------- Técnicas de OKRs ---------------- */
{ id:'OK01', d:'okr', t:'s', q:'¿Cuál de estos es el Key Result mejor formulado?',
  o:['Lanzar la nueva app móvil con onboarding digital antes del cierre del trimestre','Aumentar de forma sostenida la satisfacción de los clientes de la app móvil','Aumentar la retención a 90 días de clientes nuevos del 35% al 50%','Realizar 40 entrevistas con clientes para entender sus motivos de abandono'],
  a:[2], e:'Un KR debe ser medible y describir un resultado (outcome), con línea base y meta. Lanzar la app y hacer entrevistas son entregables o actividades (iniciativas); "aumentar de forma sostenida la satisfacción" no tiene métrica ni meta.' },
{ id:'OK02', d:'okr', t:'s', q:'Según los principios de OKRs del modelo, ¿qué nivel de logro de los resultados clave se espera y cómo se interpreta?',
  o:['100%: cualquier valor menor indica un problema de ejecución','Entre 70% y 80%: por debajo indica bajo logro y por encima, baja ambición','Entre 50% y 60%: por encima indica que el objetivo no era aspiracional','Más del 90%: los KRs se fijan sólo con metas alcanzables'],
  a:[1], e:'El principio "pragmáticos" del playbook espera un logro del 70–80% de los KRs: menos del 70% indica bajo nivel de logro y más del 80%, bajo nivel de ambición. Es coherente con el criterio de Google de que los OKRs aspiracionales no deberían cumplirse siempre al 100%.' },
{ id:'OK03', d:'okr', t:'s', q:'Un área define 12 objetivos con 8 KRs cada uno para el trimestre. ¿Cuál es el principal riesgo y la recomendación?',
  o:['Desalineamiento; conviene cascadear cada objetivo a los equipos para asegurar que todos estén cubiertos','Pérdida de foco; conviene priorizar entre 3 y 5 objetivos con 3 a 5 KRs cada uno','Metas poco ambiciosas; conviene marcar la mitad de los objetivos como aspiracionales','Sobrecarga de seguimiento; conviene pasar los check-ins de semanales a mensuales'],
  a:[1], e:'Los OKRs son una herramienta de foco. Doerr y Grove recomiendan pocos objetivos (3–5) con pocos KRs (hasta 5). Muchos objetivos diluyen la atención y terminan siendo una lista de trabajo.' },
{ id:'OK04', d:'okr', t:'s', q:'La dirección quiere atar el bono anual al porcentaje de cumplimiento de los OKRs de cada persona. Según las prácticas recomendadas por Doerr y Google, ¿qué conviene?',
  o:['Atarlo sólo a los OKRs comprometidos y dejar los aspiracionales fuera de la compensación','Desacoplar los OKRs de la compensación, porque atarlos incentiva metas conservadoras','Atarlo con un peso bajo (por ejemplo, 10% del bono) para no distorsionar la ambición','Atarlo al puntaje del OKR del equipo y no al individual, para fomentar la colaboración'],
  a:[1], e:'La recomendación de Doerr y Google es separar los OKRs de la evaluación y la compensación. Cualquier vínculo, aunque sea parcial o grupal, empuja a proponer metas fáciles (sandbagging) y erosiona el valor aspiracional.' },
{ id:'OK05', d:'okr', t:'s', q:'¿Qué enfoque de alineamiento de OKRs se considera una buena práctica?',
  o:['Cascada obligatoria: cada equipo adopta un KR del nivel superior como su objetivo','Combinar dirección top-down con propuestas bottom-up alineadas a los OKRs de la organización','Que cada equipo defina sus OKRs y luego el liderazgo los consolide en los OKRs corporativos','Que el área de estrategia redacte los OKRs de todos los equipos para garantizar la coherencia'],
  a:[1], e:'La cascada obligatoria es lenta y quita autonomía; la consolidación pura bottom-up pierde la estrategia. Doerr sugiere que una parte importante de los OKRs surja desde los equipos, alineada a los objetivos de nivel superior.' },
{ id:'OK06', d:'okr', t:'m', q:'¿Qué características debe tener un buen Key Result?',
  o:['Ser medible y verificable al final del período','Describir un resultado (outcome), no una tarea','Estar bajo el control total del equipo, sin depender de factores externos','Incluir las iniciativas necesarias para lograrlo'],
  a:[0,1], e:'Un KR responde "¿cómo sabremos que logramos el objetivo?": es cuantitativo, verificable y centrado en el resultado. Los resultados rara vez están bajo control total del equipo (basta con que pueda influirlos), y las iniciativas se gestionan aparte.' },
{ id:'OK07', d:'okr', t:'s', q:'¿Cuál es la diferencia más precisa entre un KPI y un OKR?',
  o:['Los KPIs miden resultados de negocio y los OKRs miden el avance de los proyectos estratégicos','Un KPI monitorea la salud continua de algo; un OKR busca un cambio significativo en un período','Los KPIs son anuales y los OKRs trimestrales; por lo demás, cumplen la misma función','Los OKRs reemplazan a los KPIs: una vez adoptados, los KPIs dejan de ser necesarios'],
  a:[1], e:'Los KPIs son indicadores de salud que se observan siempre; los OKRs enfocan el esfuerzo en mejorar algo durante un ciclo. Es común tomar un KPI que se quiere mover y convertirlo en KR, y ambos conviven.' },
{ id:'OK08', d:'okr', t:'s', q:'¿Cómo es el ciclo de OKRs de los squads en el modelo?',
  o:['Se definen cada trimestre y se revisan al cierre de cada sprint, en la Sprint Review','Se definen anualmente y se revisan y recalibran cada trimestre','Se definen al inicio de cada iniciativa y se revisan sólo al cerrarla formalmente','Se definen anualmente y se revisan una vez al año en la evaluación de desempeño'],
  a:[1], e:'Los OKRs se definen anualmente (propuestos por los POs y acordados con la gerencia y los stakeholders) y se revisan y recalibran cada trimestre. El avance de los KRs de los squads se inspecciona además de forma mensual.' },
{ id:'OK15', d:'okr', t:'s', q:'¿Quién propone los OKRs de los squads y quién responde por su cumplimiento?',
  o:['El Tribe Lead los define y los Scrum Masters responden por su seguimiento y cumplimiento','Los POs los proponen, se acuerdan con la gerencia y los POs responden por ejecutarlos','La Oficina de Transformación los define y cada Developer responde por un KR asignado','El Agile Coach los propone en el Inception y el Sponsor responde por su cumplimiento'],
  a:[1], e:'En el modelo, los Product Owners proponen los OKRs, que luego se discuten y acuerdan con la gerencia y los stakeholders de la iniciativa. Los POs son responsables últimos de ejecutar las iniciativas que los cumplen y de controlarlos para tomar acciones correctivas.' },
{ id:'OK16', d:'okr', t:'s', q:'¿Cómo se alinean los OKRs desde la estrategia hasta el trabajo de los squads?',
  o:['Plan estratégico → objetivos estratégicos → OKRs de squads → iniciativas','Iniciativas → OKRs de squads → objetivos estratégicos → plan estratégico','OKRs individuales → OKRs de squad → OKRs de tribu → plan estratégico','Plan estratégico → presupuesto por área → OKRs individuales → tareas del sprint'],
  a:[0], e:'Los OKRs "cascadean" desde los objetivos e indicadores estratégicos (Plan Horizonte) hacia los customer journeys, cuyos squads definen OKRs que aseguran la ambición estratégica; las iniciativas apuntan a esos KRs. El modelo combina además OKRs descendentes y ascendentes.' },
{ id:'OK09', d:'okr', t:'s', q:'¿Cuál de estos enunciados está mejor formulado como Objetivo (la "O" de OKR)?',
  o:['Aumentar el NPS de las pymes de 32 a 45 durante el trimestre','Convertirnos en la opción preferida de las pymes para pagos digitales','Implementar la nueva plataforma de pagos para pymes antes de marzo','Mejorar los procesos internos de atención a clientes pymes'],
  a:[1], e:'El objetivo es cualitativo, inspirador y orientado al cliente; los números van en los KRs. El NPS sería un buen KR, la plataforma es una iniciativa y "mejorar los procesos internos" es vago y no inspira.' },
{ id:'OK10', d:'okr', t:'s', q:'Para un objetivo de reducir la cancelación de clientes (churn), ¿cuál es el mejor indicador adelantado (leading)?',
  o:['Churn mensual de clientes, medido por cohorte de alta','Ingresos promedio por cliente durante el trimestre','% de clientes nuevos que usan la función clave en su primera semana','Tasa de renovación anual de contratos y de productos'],
  a:[2], e:'Los indicadores adelantados se mueven antes que el resultado y permiten actuar a tiempo. La activación temprana suele predecir la retención; el churn, los ingresos y la renovación son indicadores rezagados (lagging).' },
{ id:'OK11', d:'okr', t:'s', q:'Un equipo puso como KR "Implementar el chatbot de atención". ¿Qué le recomendarías?',
  o:['Mantenerlo, agregando una fecha y un porcentaje de avance para que sea medible','Expresar el resultado esperado (por ejemplo, reducir el tiempo de primera respuesta) y tratar el chatbot como iniciativa','Convertirlo en objetivo y definir como KRs las etapas del proyecto: diseño, piloto y lanzamiento','Mantenerlo como KR comprometido, ya que su cumplimiento depende sólo del equipo'],
  a:[1], e:'Un entregable no garantiza un resultado. Separar el KR (outcome) de la iniciativa (output) permite cambiar la solución si no mueve la aguja.' },
{ id:'OK12', d:'okr', t:'s', q:'Un equipo cumple siempre el 100% de sus OKRs aspiracionales, trimestre tras trimestre. ¿Qué suele indicar?',
  o:['Que es un equipo de alto desempeño y conviene replicar su forma de trabajo en otros equipos','Que probablemente sus metas son poco ambiciosas (sandbagging)','Que conviene pasar sus OKRs a comprometidos, ya que los cumple de forma confiable','Que el equipo tiene capacidad ociosa y conviene asignarle más OKRs'],
  a:[1], e:'Un cumplimiento sistemático por encima del 80% indica bajo nivel de ambición (según los principios del modelo, lo esperado es 70–80%). Vale la pena conversar sobre la ambición, la seguridad psicológica y los incentivos antes de sacar conclusiones sobre desempeño o capacidad.' },
{ id:'OK13', d:'okr', t:'s', q:'El KR "Reducir el tiempo promedio de atención de 12 a 6 minutos" genera el riesgo de que se corten llamadas sin resolver el problema. ¿Qué técnica lo mitiga?',
  o:['Pasar el KR a aspiracional para reducir la presión sobre el equipo','Agregar una métrica de contrapeso, como la resolución en el primer contacto','Reemplazar el promedio por la mediana del tiempo de atención','Medir el KR por agente para identificar a quienes cortan llamadas'],
  a:[1], e:'Por la Ley de Goodhart, una métrica convertida en meta se "juega". Las métricas de contrapeso (health metrics) protegen la calidad mientras se mueve el KR principal. Cambiar el estadístico o vigilar individuos no elimina el incentivo.' },
{ id:'OK14', d:'okr', t:'m', q:'¿Cuáles de estas situaciones son antipatrones de OKRs?',
  o:['Usar los OKRs como lista de tareas del trimestre','Vincular directamente los OKRs al bono individual','Hacer check-ins semanales de progreso y confianza','Proponer parte de los OKRs desde los equipos (bottom-up)','Considerar 0,7 como resultado esperado de un KR aspiracional'],
  a:[0,1], e:'Convertir OKRs en listas de tareas o atarlos a la compensación son antipatrones frecuentes. Los check-ins, los OKRs bottom-up y el 0,7 en aspiracionales son prácticas recomendadas.' },

/* ---------------- Herramientas de gestión ---------------- */
{ id:'TL01', d:'tools', t:'s', q:'En el modelo, ¿cuál debería ser la única fuente de demanda de trabajo de un squad y quién responde por su contenido?',
  o:['La bandeja de tickets de ServiceNow, gestionada por el Chapter Lead','El backlog en Azure Boards, responsabilidad del Product Owner','La Ficha de la Iniciativa, mantenida por el Coordinador de Valor','El plan en Microsoft Project, mantenido por el Scrum Master'],
  a:[1], e:'El playbook establece Azure Boards para la gestión colaborativa del backlog: debería ser la única fuente de demanda de trabajo de los equipos ágiles, y el PO es responsable de que esté correcto, priorizado y actualizado.' },
{ id:'TL02', d:'tools', t:'s', q:'¿Cuál es la jerarquía del backlog definida para los squads en Azure Boards?',
  o:['Epic > Feature > Product Backlog Item > Sub-tarea','Feature > Epic > Product Backlog Item > Sub-tarea','Epic > Product Backlog Item > Feature > Sub-tarea','Iniciativa > Epic > Historia de Usuario > Feature'],
  a:[0], e:'Epic y Feature forman el Portfolio backlog (visión estratégica, útil para dar visibilidad a stakeholders); los PBIs y las sub-tareas forman el Product backlog (visión táctica del squad). Los PBIs y sub-tareas tienen tipologías para categorizar el trabajo y generar métricas.' },
{ id:'TL03', d:'tools', t:'s', q:'En Azure DevOps Boards, usando la plantilla de proceso Scrum, ¿cómo se llama el work item del nivel de backlog de producto?',
  o:['User Story','Issue','Product Backlog Item','Requirement'],
  a:[2], e:'Proceso Scrum: Epic > Feature > Product Backlog Item > Task. User Story corresponde al proceso Agile, Issue al proceso Basic y Requirement al proceso CMMI.' },
{ id:'TL04', d:'tools', t:'s', q:'Un PBI en curso no puede completarse por un factor externo al squad. ¿Cómo se registra en Azure Boards según el playbook?',
  o:['Se crea un PBI de tipo Seguimiento y el PBI original vuelve a "To Do"','Se marca el PBI como "Blocked" y se crea una sub-tarea de tipo Impediment','Se crea un Bug asignado al equipo externo','Se mueve el PBI al siguiente sprint y se registra en la retrospectiva'],
  a:[1], e:'Cuando un factor externo impide avanzar, el PBI pasa a "Blocked" y se crea una sub-tarea Impediment con el trabajo necesario para eliminar el bloqueo. El tipo Seguimiento se usa para visibilizar tareas que hace otro equipo y de las que dependemos.' },
{ id:'TL05', d:'tools', t:'s', q:'En un Cumulative Flow Diagram (CFD), la banda "En progreso" se ensancha sostenidamente mientras la banda "Hecho" crece poco. ¿Qué indica?',
  o:['Que el throughput aumentó y el equipo está entregando más rápido','Que el WIP crece por un cuello de botella y el cycle time tenderá a aumentar','Que el backlog crece más rápido de lo que el equipo puede absorber','Que el equipo terminó el refinamiento y paralelizó trabajo listo, lo cual es esperable'],
  a:[1], e:'El ancho vertical de una banda es el WIP en esa etapa. Si entra más de lo que sale, se acumula WIP y crece el cycle time. El crecimiento del backlog se vería en la banda de "Por hacer", no en la de "En progreso".' },
{ id:'TL06', d:'tools', t:'s', q:'La organización quiere comprar una herramienta costosa "para volverse ágil". ¿Cuál es la mejor respuesta como Agile Coach?',
  o:['Elegir la herramienta líder del mercado, que trae incorporadas las mejores prácticas','Entender primero el flujo de trabajo y los problemas: la herramienta soporta el proceso, no lo define','Implementarla en un piloto con un equipo y luego escalarla a todos con la misma configuración','Estandarizar una única herramienta para todos los equipos antes de iniciar la transformación'],
  a:[1], e:'"Individuos e interacciones sobre procesos y herramientas". Una herramienta amplifica la forma de trabajar existente; si el flujo es malo, lo digitaliza tal cual. El piloto o la estandarización sin diagnóstico repiten el mismo error.' },
{ id:'TL07', d:'tools', t:'s', q:'Una tarea que realiza otro equipo es dependencia de una historia del squad. ¿Qué tipo de PBI se usa en Azure Boards y cómo se trata?',
  o:['Spike: se estima y se prioriza para investigar la dependencia','Seguimiento: se mapea sólo para tener visibilidad de su estado y no se estima','Habilitador: se estima como trabajo no funcional del propio squad','Deuda técnica: se registra para resolverla en un sprint posterior'],
  a:[1], e:'El PBI de Seguimiento representa tareas que hacen terceros y que son dependencias del squad: sólo se mapea para actualizarlo cuando haya novedades y no se estima. El Spike es una investigación del propio squad y sí tiene objetivo y duración acotada.' },
{ id:'TL08', d:'tools', t:'s', q:'¿Qué reporte es más útil para analizar la dispersión del cycle time de cada ítem y detectar valores atípicos?',
  o:['Burndown del sprint en puntos','Control chart o scatterplot de cycle time','Cumulative Flow Diagram por estado','Reporte de velocidad por sprint'],
  a:[1], e:'El control chart o scatterplot muestra cada ítem terminado con su cycle time, lo que permite ver percentiles, tendencias y outliers. El CFD muestra el WIP agregado por etapa, no la dispersión por ítem.' },
{ id:'TL09', d:'tools', t:'s', q:'El burndown de un equipo queda plano durante 8 de los 10 días del sprint y cae bruscamente al final. ¿Qué patrón sugiere con más probabilidad?',
  o:['Que el equipo sobrecomprometió el sprint y debería reducir la capacidad planificada','Ítems demasiado grandes o una "mini cascada": el trabajo se cierra recién al final','Que el sprint es demasiado corto para el tipo de trabajo del equipo','Que las estimaciones en story points están infladas'],
  a:[1], e:'Una curva plana seguida de una caída abrupta indica que poco trabajo se termina hasta el final, típicamente por historias grandes, testing al final o mucho WIP. Conviene trocear y limitar el WIP.' },
{ id:'TL10', d:'tools', t:'m', q:'¿Para qué es especialmente adecuada Confluence (o una wiki equivalente) en un equipo ágil?',
  o:['Documentación viva y registro de decisiones (ADR)','Plantillas compartidas de retrospectivas y acuerdos de trabajo','Gestionar el flujo de los ítems con límites de WIP','Registrar y ordenar el Product Backlog con sus estimaciones'],
  a:[0,1], e:'Una wiki sirve para el conocimiento compartido: decisiones, acuerdos, actas y documentación viva. El flujo de ítems y el backlog se gestionan en herramientas como Jira o Azure Boards.' },
{ id:'TL11', d:'tools', t:'s', q:'El backlog de Jira de un equipo tiene más de 300 ítems y la mayoría lleva más de un año sin cambios. ¿Qué recomendarías?',
  o:['Refinarlos y estimarlos todos para obtener una proyección completa del producto','Depurar o archivar lo que no aporta y mantener un backlog emergente y manejable','Crear un backlog paralelo para lo urgente y dejar el actual como histórico','Asignar cada ítem a un responsable para revisarlo durante el próximo trimestre'],
  a:[1], e:'Un backlog enorme genera ruido, mantenimiento y falsas expectativas. Un backlog sano está ordenado, refinado en su parte superior y depurado periódicamente; lo importante vuelve a surgir.' },
{ id:'TL12', d:'tools', t:'s', q:'En Azure Boards, ¿quién crea los PBIs de tipo Bug y de tipo Incidente, respectivamente?',
  o:['El Product Owner (bugs) y el Scrum Master (incidentes), que gestionan el backlog','QA (bugs) y el Chapter Lead (incidentes)','Los Developers (bugs) y el Nivel 1 de soporte (incidentes), al detectarlos','El Scrum Master (bugs) y QA (incidentes), según el ambiente donde aparecen'],
  a:[1], e:'El Bug lo crea QA cuando encuentra un defecto o incumplimiento de criterios de aceptación en ambientes previos. El Incidente lo crea el Chapter Lead cuando recibe un defecto productivo (vía ServiceNow), y puede derivar en otros PBIs para resolverlo.' },
{ id:'TL13', d:'tools', t:'s', q:'¿Qué servicio de Azure DevOps se utiliza para integración y entrega continua (CI/CD)?',
  o:['Azure Boards','Azure Repos','Azure Pipelines','Azure Artifacts'],
  a:[2], e:'Azure DevOps incluye Boards (gestión del trabajo), Repos (git), Pipelines (CI/CD), Test Plans (pruebas) y Artifacts (paquetes).' },
{ id:'TL14', d:'tools', t:'s', q:'Para facilitar un User Story Mapping remoto durante el Inception, ¿qué herramienta del stack definido es la más adecuada?',
  o:['Miro, tablero digital colaborativo en tiempo real','Figma, herramienta de diseño de interfaces y prototipos','Delivery Plans de Azure Boards','Un Excel compartido en SharePoint con una columna por actividad'],
  a:[0], e:'El playbook define Miro para talleres y reuniones apoyadas en un tablero visual colaborativo. Figma se usa para el diseño de interfaces y prototipos, y Delivery Plans para los planes de liberación; ninguna sirve para mover tarjetas libremente en dos ejes.' },
{ id:'TL15', d:'tools', t:'s', q:'Según el playbook, ¿dónde deben cargarse los documentos necesarios para el desarrollo?',
  o:['Todos en una carpeta compartida de OneDrive del squad','Los transversales en la Wiki de Azure DevOps y los específicos adjuntos al PBI correspondiente','Todos como adjuntos en el ticket de ServiceNow','Los transversales en la Ficha de la Iniciativa y los específicos en Microsoft Project'],
  a:[1], e:'Para centralizar la información en una única herramienta, los documentos transversales van en la sección Wiki (Overview) de Azure DevOps y los específicos se adjuntan al PBI, como imagen en la descripción o en Attachments.' },
{ id:'TL16', d:'tools', t:'s', q:'¿Qué funcionalidad de Azure Boards se usa para gestionar los planes de liberación (fechas, hitos y PBIs asignados a cada release)?',
  o:['Delivery Plans','Sprint Taskboard','Queries','Backlog de Epics'],
  a:[0], e:'Los releases se gestionan en la sección Delivery Plans, que permite crear planes de liberación, definir fechas, agregar hitos, asignar PBIs y seguir visualmente su estado.' },
{ id:'TL17', d:'tools', t:'s', q:'En Azure Boards, un PBI no puede abordarse hasta que otro esté terminado. ¿Qué tipo de vínculo corresponde?',
  o:['Parent / Child','Predecessor / Successor','Related','Duplicate'],
  a:[1], e:'Predecessor indica el PBI que debe realizarse antes; Successor, el que no puede hacerse hasta terminar el actual. Parent/Child expresa contención (el padre no se cierra hasta que se cierren sus hijos) y Related, PBIs que deben liberarse juntos.' },
{ id:'TL18', d:'tools', t:'s', q:'En el flujo de incidentes productivos, ¿qué rol recibe el incidente desde el Nivel 1 en ServiceNow y lo asigna al especialista adecuado?',
  o:['El Product Owner del squad','El Chapter Lead de la disciplina','El Scrum Master del squad','El Agile Coach de la tribu'],
  a:[1], e:'El Nivel 1 categoriza y deriva el incidente a la bandeja del chapter según el catálogo de aplicaciones. El Chapter Lead lo asigna según especialidad, carga y SLA; el PO puede objetar la asignación o repriorizar dentro del squad.' },

/* ---------------- Métricas organizacionales y de equipos ---------------- */
{ id:'ME01', d:'met', t:'m', q:'Según la Guía Kanban (2020), ¿cuáles son las medidas de flujo que deben seguirse como mínimo?',
  o:['WIP (trabajo en curso)','Throughput','Work Item Age (antigüedad del ítem)','Cycle Time','Lead Time','Eficiencia de flujo'],
  a:[0,1,2,3], e:'La Guía Kanban establece cuatro medidas obligatorias: WIP, Throughput, Work Item Age y Cycle Time. Lead time y eficiencia de flujo son útiles, pero no forman parte del mínimo de la Guía.' },
{ id:'ME02', d:'met', t:'s', q:'La gerencia quiere comparar la velocidad (story points por sprint) entre equipos para premiar al más productivo. ¿Cuál es la mejor respuesta?',
  o:['Hacerlo, normalizando los story points con una tabla de equivalencias común','Explicar que los puntos son relativos a cada equipo y proponer métricas de resultado','Hacerlo sólo entre equipos del mismo tamaño y con el mismo tipo de trabajo','Reemplazar los puntos por horas estimadas para que la comparación sea justa'],
  a:[1], e:'La velocidad es una herramienta de planificación interna, no una medida de productividad comparable. Normalizarla o pasarla a horas activa la Ley de Goodhart: las estimaciones se inflan sin que cambie el valor.' },
{ id:'ME03', d:'met', t:'s', q:'Los cycle times de un equipo tienen una distribución con cola larga a la derecha. ¿Qué conviene usar para comunicar expectativas de entrega?',
  o:['El promedio, porque considera todos los ítems terminados','Un percentil alto: "el 85% se termina en 10 días o menos"','La mediana, porque es robusta frente a los valores atípicos','El promedio más una desviación estándar, como margen de seguridad'],
  a:[1], e:'Los cycle times rara vez siguen una distribución normal; el promedio y la desviación estándar engañan. La mediana sólo da un 50% de confianza. Un percentil alto comunica probabilidad y es la base de las SLE.' },
{ id:'ME04', d:'met', t:'s', q:'¿Por qué es valiosa la métrica Work Item Age?',
  o:['Mide el tiempo que un ítem pasa en el backlog antes de comenzar','Permite detectar ítems en riesgo mientras están en curso','Permite calcular el cycle time sin esperar que los ítems terminen','Mide la antigüedad de lo terminado para estimar deuda técnica'],
  a:[1], e:'Work Item Age es el tiempo transcurrido desde que un ítem empezó y aún no terminó. Es un indicador adelantado que permite intervenir a tiempo (por ejemplo, en la Daily), antes de que el cycle time sea alto.' },
{ id:'ME05', d:'met', t:'s', q:'Un ítem tardó 20 días desde que empezó hasta que se entregó, pero sólo hubo trabajo activo sobre él durante 4 días. ¿Cuál es su eficiencia de flujo?',
  o:['80%','20%','25%','16%'],
  a:[1], e:'Eficiencia de flujo = tiempo activo / tiempo total = 4 / 20 = 20%. En la mayoría de las organizaciones es baja (15–40%) por esperas y traspasos: la mejora suele estar en las colas, no en "trabajar más rápido".' },
{ id:'ME06', d:'met', t:'s', q:'La dirección fija como meta "duplicar la velocidad del equipo este semestre". ¿Qué es lo más probable que ocurra?',
  o:['Que el equipo encuentre formas de entregar el doble de valor','Que los story points se inflen sin cambio real en lo entregado','Que el equipo reduzca su WIP para enfocarse en terminar','Que mejore la previsibilidad de las entregas del equipo'],
  a:[1], e:'Ley de Goodhart: "cuando una medida se convierte en objetivo, deja de ser una buena medida". La velocidad es fácil de mover cambiando las estimaciones, sin que cambie el valor entregado.' },
{ id:'ME07', d:'met', t:'s', q:'Un stakeholder pregunta "¿cuándo estarán listos estos 40 ítems?". ¿Qué técnica responde de forma probabilística a partir de datos históricos?',
  o:['Dividir la cantidad de ítems por el throughput promedio semanal','Simulación de Monte Carlo sobre el throughput histórico','Estimar los 40 ítems con Planning Poker y proyectar con la velocidad','Estimar en horas cada ítem y sumar con un margen del 20%'],
  a:[1], e:'Monte Carlo muestrea repetidamente el throughput histórico y produce una distribución de fechas ("85% de probabilidad antes del 15/03"). Las otras opciones dan una única fecha determinística, sin probabilidad.' },
{ id:'ME08', d:'met', t:'s', q:'¿Cuál es el uso correcto del Squad Health Check (modelo de Spotify)?',
  o:['Construir un ranking entre squads para decidir dónde invertir en coaching','Autoevaluación del squad para conversar y decidir mejoras, sin comparar equipos','Evaluar el desempeño del Agile Coach o Scrum Master de cada squad','Medir la madurez ágil de cada squad frente a un modelo estándar'],
  a:[1], e:'El Health Check es para que el equipo reflexione y para que el liderazgo vea patrones agregados. Si se usa para comparar, evaluar personas o auditar madurez, las respuestas dejan de ser honestas.' },
{ id:'ME09', d:'met', t:'m', q:'¿Cuáles son las áreas clave de valor (Key Value Areas) de Evidence-Based Management (Scrum.org)?',
  o:['Valor actual (Current Value)','Valor no realizado (Unrealized Value)','Capacidad de innovar (Ability to Innovate)','Tiempo de llegada al mercado (Time to Market)','Eficiencia operativa (Operational Efficiency)','Calidad del producto (Product Quality)'],
  a:[0,1,2,3], e:'EBM propone cuatro áreas clave de valor: Current Value, Unrealized Value, Time to Market y Ability to Innovate. La calidad aparece como medida dentro de Ability to Innovate, no como área propia.' },
{ id:'ME10', d:'met', t:'s', q:'¿Cuál es la diferencia más habitual entre lead time y cycle time?',
  o:['Son equivalentes; el término cambia según el framework','El lead time va del pedido a la entrega al cliente; el cycle time, del inicio del trabajo a su fin','El lead time va del commit a producción; el cycle time, del inicio del trabajo al commit','El cycle time incluye el tiempo en el backlog; el lead time, sólo el desarrollo'],
  a:[1], e:'El lead time refleja la experiencia del cliente (cuánto espera desde que pide); el cycle time, el sistema de entrega del equipo. "Del commit a producción" es el lead time for changes de DORA, una medida distinta.' },
{ id:'ME11', d:'met', t:'s', q:'Un área quiere medir la "agilidad" por el porcentaje de utilización de cada persona, con una meta del 100%. ¿Cuál es el problema principal?',
  o:['Que es difícil de medir con precisión en el trabajo de conocimiento','Que cerca del 100% de utilización las colas y esperas crecen de forma no lineal','Que incentiva a registrar horas de forma poco precisa','Que no considera las horas extra ni las ausencias del equipo'],
  a:[1], e:'La teoría de colas muestra que, al acercarse al 100% de utilización, los tiempos de espera se disparan. Optimizar la ocupación de las personas en vez del flujo del trabajo aumenta el lead time.' },
{ id:'ME12', d:'met', t:'m', q:'¿Cuáles de estas métricas son accionables (frente a métricas de vanidad)?',
  o:['Tasa de conversión por cohorte de clientes','Percentil 85 del cycle time de las últimas 8 semanas','Total acumulado de usuarios registrados desde el lanzamiento','Cantidad de despliegues acumulados desde el inicio del producto'],
  a:[0,1], e:'Las métricas accionables comparan contra una referencia y cambian decisiones (cohortes, percentiles en una ventana de tiempo). Los totales acumulados siempre crecen y no indican si estamos mejorando.' },
{ id:'ME13', d:'met', t:'s', q:'¿Qué recomienda el framework SPACE para medir la productividad de equipos de desarrollo?',
  o:['Usar la actividad (commits, pull requests) como indicador principal y complementarla con encuestas','Combinar varias dimensiones con datos de sistema y de percepción, sin depender de una sola métrica','Construir un índice único ponderado por desarrollador para comparar desempeño','Adoptar las métricas DORA como medida suficiente de la productividad'],
  a:[1], e:'SPACE (Forsgren et al., 2021) propone cinco dimensiones: satisfacción, desempeño, actividad, colaboración, y eficiencia y flujo. Recomienda usar al menos tres y combinar datos de sistema con percepciones.' },
{ id:'ME14', d:'met', t:'s', q:'Según el Proyecto Aristóteles de Google, ¿qué factor es el más importante para la efectividad de un equipo?',
  o:['Seguridad psicológica','Confiabilidad (dependability)','Estructura y claridad','Significado del trabajo'],
  a:[0], e:'El estudio identificó cinco factores: seguridad psicológica, confiabilidad, estructura y claridad, significado e impacto. La seguridad psicológica resultó ser, por lejos, el más determinante.' },
{ id:'ME15', d:'met', t:'s', q:'¿Qué mide el indicador "Puntos de Change" definido para los squads?',
  o:['El % de puntos comprometidos al inicio del sprint que efectivamente se entregaron al finalizarlo','El % de puntos dedicados a Historias de Usuario (Change) sobre el total de Change + Run','La cantidad de cambios a producción que pasaron por el proceso formal de control de cambios','La variación porcentual de la velocidad del squad respecto del promedio de los últimos sprints'],
  a:[1], e:'Puntos de Change mide la "centricidad en el cliente": qué parte del esfuerzo va a funcionalidades para usuarios frente al trabajo de Run (incidencias, spikes, habilitadores técnicos o normativos). Si el Run crece más de lo previsto, hay que buscar causas. La primera opción describe Cumplimiento de Sprint.' },
{ id:'ME16', d:'met', t:'s', q:'En el marco de indicadores del modelo, ¿qué es el Release Lead Time?',
  o:['El tiempo promedio que tarda un PBI en pasar de un estado A a un estado B cualquiera','El tiempo transcurrido desde que un PBI se comienza a trabajar hasta que se libera a producción','La cantidad de liberaciones a producción por unidad de tiempo','El tiempo desde que se aprueba la iniciativa en la QBR hasta su primer release'],
  a:[1], e:'El playbook define Lead Time como el tiempo entre dos estados cualesquiera (por ejemplo, de "Priorizado" a "Terminado"); el Release Lead Time es el caso particular desde que se empieza a trabajar hasta la liberación a producción. La cantidad de liberaciones es la Frecuencia de liberaciones.' },
{ id:'ME17', d:'met', t:'s', q:'¿Cuál de estas NO es una de las cinco dimensiones del marco de indicadores de desempeño de los squads?',
  o:['Generación de valor','Disponibilidad, confiabilidad y seguridad','Eficiencia de costos por desarrollador','Desarrollo del equipo'],
  a:[2], e:'Los 19 indicadores se agrupan en cinco dimensiones: Generación de valor, Productividad, Disponibilidad/confiabilidad/seguridad, Automatización de pruebas y Desarrollo del equipo (clima y madurez ágil). No se mide la eficiencia de costos por persona.' },
{ id:'ME18', d:'met', t:'s', q:'Un gerente propone convertir los puntos de historia a horas para controlar mejor la capacidad del squad. Según el modelo, ¿qué corresponde?',
  o:['Hacerlo, usando la velocidad promedio del squad como factor de conversión','Explicar que los puntos son relativos a una historia pivote y no equivalen a horas','Hacerlo sólo para habilitadores y deuda técnica, que no aportan valor de negocio','Reemplazar los puntos por horas desde el próximo trimestre en todos los squads'],
  a:[1], e:'El playbook define los puntos de historia como unidades de esfuerzo relativas a un patrón de comparación (pivote 5, serie de Fibonacci) que no deben convertirse en horas. La velocidad sirve para la previsibilidad del propio squad, no como medida de horas.' },

/* ---------------- Coaching y mentoring de equipos ---------------- */
{ id:'CO01', d:'coach', t:'s', q:'En el marco de competencias de Agile Coaching de Lyssa Adkins y Michael Spayd, ¿qué distingue la postura de coaching profesional de la de mentoring?',
  o:['El coaching se enfoca en el desempeño a corto plazo y el mentoring en la carrera a largo plazo','En coaching el cliente encuentra sus respuestas; en mentoring el mentor comparte su experiencia','En coaching se enseñan prácticas ágiles; en mentoring se acompaña la dimensión emocional','El coaching se aplica a equipos y el mentoring a personas individuales'],
  a:[1], e:'En el marco de Adkins y Spayd, el coaching profesional parte de que el cliente tiene las respuestas y el coach no aconseja; el mentoring transfiere la experiencia del mentor (y la enseñanza, el conocimiento). El Agile Coach elige la postura según el contexto.' },
{ id:'CO02', d:'coach', t:'s', q:'¿Cuál es la secuencia del modelo GROW de John Whitmore?',
  o:['Goal, Reality, Options, Will','Reality, Goal, Options, Will','Goal, Options, Reality, Will','Goal, Resources, Options, Wrap-up'],
  a:[0], e:'GROW: definir la meta (Goal), explorar la realidad actual (Reality), generar opciones (Options) y acordar la voluntad y los próximos pasos (Will / Way forward).' },
{ id:'CO03', d:'coach', t:'s', q:'¿Cuál de estas es la pregunta más poderosa en una sesión de coaching con un equipo?',
  o:['¿No creen que convendría dividir mejor las historias?','¿Por qué el equipo no cumplió lo comprometido en el sprint?','¿Qué les gustaría que fuera distinto al final de este sprint?','¿Probaron hacer refinamiento dos veces por semana?'],
  a:[2], e:'Una pregunta poderosa es abierta, no inductiva ni enjuiciadora, y promueve la reflexión y la responsabilidad. "¿No creen que…?" y "¿Probaron…?" son consejos disfrazados; "¿Por qué no…?" genera defensividad.' },
{ id:'CO04', d:'coach', t:'s', q:'Un equipo recién formado tiene discusiones frecuentes sobre roles y formas de trabajar. Según Tuckman, ¿en qué etapa está y qué conviene?',
  o:['Forming; dar claridad de objetivos y roles, y esperar a que el conflicto se resuelva solo','Storming; facilitar el conflicto constructivo y ayudar a construir acuerdos de trabajo','Norming; reforzar las normas existentes y escalar los conflictos al líder','Storming; reubicar a quienes discuten en otros equipos para reducir la fricción'],
  a:[1], e:'Storming es una etapa natural (forming, storming, norming, performing). Evitar o suprimir el conflicto lo prolonga; facilitarlo y generar acuerdos de trabajo ayuda a pasar a norming.' },
{ id:'CO05', d:'coach', t:'s', q:'Según "Las cinco disfunciones de un equipo" de Patrick Lencioni, ¿cuál es la disfunción base sobre la que se apoyan las demás?',
  o:['Falta de compromiso','Ausencia de confianza','Temor al conflicto','Evitación de responsabilidades'],
  a:[1], e:'La pirámide de Lencioni: ausencia de confianza → temor al conflicto → falta de compromiso → evitación de responsabilidades → falta de atención a los resultados.' },
{ id:'CO06', d:'coach', t:'s', q:'Un equipo nuevo en Scrum no conoce las prácticas básicas. Según Shu-Ha-Ri, ¿qué postura conviene adoptar como coach?',
  o:['Coaching no directivo, para que el equipo descubra por sí mismo las prácticas que le funcionan','Enseñar y acompañar a seguir las prácticas tal como están definidas, con postura de enseñanza y mentoring','Alentar desde el inicio la adaptación del framework al contexto del equipo','Observar sin intervenir durante algunos sprints para diagnosticar antes de actuar'],
  a:[1], e:'En Shu se aprenden y siguen las reglas; en Ha se adaptan; en Ri se trascienden. Con equipos principiantes, enseñar y hacer mentoring es más útil que el coaching no directivo o que adaptar el framework antes de entenderlo.' },
{ id:'CO07', d:'coach', t:'s', q:'Un gerente le pide al coach que le cuente lo que dijo cada persona del equipo en las sesiones individuales. ¿Qué debería hacer?',
  o:['Compartir la información, ya que el sponsor es quien contrató el proceso de coaching','Mantener la confidencialidad acordada y ofrecer sólo patrones generales consentidos por el equipo','Compartir sólo lo relacionado con el desempeño, que es de interés legítimo del gerente','Sugerir que el gerente asista a las sesiones individuales para escuchar de primera mano'],
  a:[1], e:'El acuerdo de coaching (contracting) define objetivos, roles y confidencialidad para todas las partes. Romperlo, aunque sea parcialmente, destruye la confianza; el coach puede compartir tendencias acordadas sin identificar a nadie.' },
{ id:'CO08', d:'coach', t:'s', q:'En el modelo Co-Active, ¿qué caracteriza la escucha de nivel 3?',
  o:['Escucha interna: lo que significa para mí lo que dice la otra persona','Escucha focalizada: atención total en las palabras de la otra persona','Escucha global: el entorno, la energía, las emociones y lo no dicho','Escucha reflexiva: parafrasear para confirmar que se comprendió'],
  a:[2], e:'Nivel 1: escucha interna. Nivel 2: escucha focalizada en el otro. Nivel 3: escucha global, que incluye el contexto, la energía del grupo y la intuición. La escucha reflexiva es una técnica, no un nivel del modelo.' },
{ id:'CO09', d:'coach', t:'m', q:'¿Qué técnicas favorecen decisiones grupales inclusivas, donde todas las voces se escuchan?',
  o:['Fist of Five (puño de cinco)','1-2-4-All (Liberating Structures)','Votación a mano alzada inmediatamente después de que el líder presenta su propuesta','Discusión abierta hasta que se alcance consenso entre quienes más participan'],
  a:[0,1], e:'Fist of Five muestra rápidamente el grado de acuerdo de todos; 1-2-4-All da espacio a la reflexión individual antes de la conversación grupal. Votar tras la propuesta del líder lo ancla, y la discusión abierta favorece a las voces dominantes.' },
{ id:'CO10', d:'coach', t:'s', q:'En una retrospectiva, dos subgrupos se acusan mutuamente ("ellos siempre..."), se forman bandos y lo importante pasó a ser ganar la discusión. Según Speed Leas, ¿en qué nivel de conflicto están?',
  o:['Nivel 2: Desacuerdo','Nivel 3: Contienda','Nivel 4: Cruzada','Nivel 5: Guerra mundial'],
  a:[1], e:'Leas: 1 Problema a resolver, 2 Desacuerdo (autoprotección, lenguaje cauteloso), 3 Contienda (ganar importa más que resolver, bandos, generalizaciones), 4 Cruzada (proteger al propio grupo, posturas ideológicas), 5 Guerra mundial (destruir al otro).' },
{ id:'CO11', d:'coach', t:'s', q:'Después de un año, el equipo depende del Agile Coach para facilitar todos sus eventos. ¿Qué es lo más adecuado?',
  o:['Seguir facilitando todos los eventos para no poner en riesgo los resultados del equipo','Transferir capacidades: rotar la facilitación, hacer mentoring y planificar la salida','Retirarse por completo para que el equipo desarrolle autonomía por necesidad','Designar al Scrum Master como facilitador permanente de todos los eventos del equipo'],
  a:[1], e:'El objetivo del coach es que el equipo pueda prescindir de él. Generar dependencia es un antipatrón; retirarse de golpe o trasladar la dependencia a otra persona no construye la capacidad del equipo.' },
{ id:'CO12', d:'coach', t:'s', q:'¿Cuál de estos feedbacks sigue correctamente el modelo SBI (Situación–Comportamiento–Impacto)?',
  o:['En la planning de ayer interrumpiste a Ana; eso muestra falta de respeto hacia el equipo','En la planning de ayer interrumpiste a Ana tres veces; ella dejó de participar y perdimos su análisis','Últimamente interrumpes mucho en las reuniones y eso está afectando al equipo','En la planning de ayer estuviste muy dominante; deberías dejar hablar más a los demás'],
  a:[1], e:'SBI describe una situación concreta, un comportamiento observable y su impacto. Las otras opciones atribuyen intenciones ("falta de respeto"), generalizan ("últimamente") o juzgan y aconsejan ("dominante").' },
{ id:'CO13', d:'coach', t:'s', q:'Un equipo sabe hacer pruebas automatizadas pero no ve el valor de adoptarlas. ¿Qué postura suele ser más útil?',
  o:['Enseñanza: volver a explicar la técnica con ejemplos tomados del propio código del equipo','Coaching: explorar con preguntas qué les importa, qué obstáculos ven y qué valor tendría','Mentoring: contar cómo otros equipos obtuvieron beneficios concretos con esta práctica','Pedir al líder que incorpore la práctica como obligatoria en la Definition of Done'],
  a:[1], e:'Si falta conocimiento, conviene enseñar o hacer mentoring; si el obstáculo es la motivación o la percepción de valor, el coaching ayuda a que el equipo encuentre sus propias razones y se comprometa. Imponerla genera cumplimiento, no adopción.' },
{ id:'CO14', d:'coach', t:'s', q:'¿Cuál es la definición de seguridad psicológica de Amy Edmondson?',
  o:['Un clima de confianza en el que los miembros evitan el conflicto para preservar las relaciones','La creencia compartida de que el equipo es un lugar seguro para asumir riesgos interpersonales','La certeza de que no habrá consecuencias negativas por un bajo desempeño','Un ambiente en el que las decisiones se toman por consenso y todos están de acuerdo'],
  a:[1], e:'Seguridad psicológica no significa comodidad, ausencia de conflicto ni falta de exigencia: es poder preguntar, admitir errores o disentir sin miedo a represalias. Habilita el conflicto productivo.' },
{ id:'CO15', d:'coach', t:'s', q:'Un Chapter Lead quiere un formato para las sesiones del chapter sin agenda predefinida, en el que los participantes propongan y voten los temas a discutir. ¿Qué práctica es?',
  o:['Lean Coffee','Skill Matrix','Aprendiendo de mis errores','Retrospectiva Starfish'],
  a:[0], e:'Lean Coffee es el formato "predeterminado" sugerido para las sesiones de chapter: sin agenda, los participantes deciden colectivamente qué discutir y generan acciones. La Skill Matrix mapea capacidades y "Aprendiendo de mis errores" comparte fallas y aprendizajes.' },
{ id:'CO16', d:'coach', t:'s', q:'¿Para qué usa un Chapter Lead la Skill Matrix?',
  o:['Para evaluar el desempeño individual y definir los bonos de los miembros del chapter','Para mapear competencias del chapter, priorizar brechas y planificar su desarrollo','Para asignar las historias de usuario a cada miembro según su nivel en cada skill','Para medir la velocidad individual de cada miembro y compararla dentro del chapter'],
  a:[1], e:'La Skill Matrix mapea las capacidades técnicas y blandas del chapter (escala de "sin competencia" a "alto dominio"), prioriza las brechas más profundas y orienta un plan de acción para fortalecer el conocimiento cruzado. Cada Chapter Lead define los skills de su especialidad.' },
{ id:'CO17', d:'coach', t:'s', q:'¿Qué caracteriza a los Acuerdos del squad (Team Canvas) definidos en el modelo?',
  o:['Los define el Scrum Master al inicio y se mantienen fijos durante toda la iniciativa','El squad los construye, se compromete con ellos y los revisa en las retrospectivas','Los aprueba el Chapter Lead como parte de los estándares y lineamientos de su práctica','Forman parte de la Definition of Done y se revisan antes de aceptar cada historia'],
  a:[1], e:'Los acuerdos son reglas de convivencia definidas y comprometidas por todo el squad (valores, comportamientos aceptados y rechazados). Se construyen en el Team Discovery y se debaten en cada retrospectiva para mejorarlos.' },

/* ---------------- Microsoft Office 365 ---------------- */
{ id:'OF01', d:'o365', t:'s', q:'¿Qué aplicación de Microsoft 365 organiza las tareas de un equipo en "buckets" sobre un tablero visual y se integra como pestaña en Teams?',
  o:['Microsoft Planner','Microsoft To Do','Microsoft Lists','OneNote'],
  a:[0], e:'Planner organiza tareas en buckets, con asignaciones, etiquetas y gráficos, y se integra como pestaña de Teams. To Do es para tareas personales; Lists gestiona listas con vistas, pero no usa buckets.' },
{ id:'OF02', d:'o365', t:'s', q:'Quieres hacer una retrospectiva asincrónica con respuestas anónimas dentro de la organización. ¿Qué opción lo garantiza?',
  o:['Microsoft Forms con la opción "Registrar nombre" desactivada','Microsoft Forms restringido a "Solo personas de mi organización", con su configuración por defecto','Una lista de Microsoft Lists con permisos de edición para todo el equipo','Un documento de Word en coautoría donde cada persona agrega sus comentarios'],
  a:[0], e:'Forms permite no registrar el nombre de quien responde. Restringir a la organización, por defecto, registra el nombre; Lists y Word muestran quién creó o editó cada entrada.' },
{ id:'OF03', d:'o365', t:'s', q:'¿Qué condición permite la coautoría en tiempo real de un documento de Word o Excel?',
  o:['Activar "Compartir libro" en la versión de escritorio de Excel','Guardar el archivo en OneDrive o SharePoint y compartir el enlace','Enviarlo como adjunto en Outlook con seguimiento de cambios activado','Habilitar el control de cambios en Word antes de enviarlo a los revisores'],
  a:[1], e:'La coautoría moderna requiere que el archivo esté en la nube (OneDrive/SharePoint). "Compartir libro" es una función heredada, y los adjuntos o el control de cambios generan copias o revisiones secuenciales, no edición simultánea.' },
{ id:'OF04', d:'o365', t:'s', q:'¿Qué herramienta del ecosistema Microsoft es más adecuada para un dashboard interactivo y actualizable de métricas de flujo, alimentado desde Jira y Excel y compartido con stakeholders?',
  o:['Power BI','Excel con tablas y gráficos dinámicos','Microsoft Lists con vistas personalizadas','Power Apps'],
  a:[0], e:'Power BI se conecta a múltiples fuentes, programa actualizaciones y publica tableros interactivos. Excel sirve para análisis puntuales, pero no es la herramienta adecuada para un tablero compartido y actualizable; Power Apps sirve para construir aplicaciones.' },
{ id:'OF05', d:'o365', t:'s', q:'Tienes los cycle times en A2:A100. ¿Qué fórmula de Excel devuelve el percentil 85?',
  o:['=PERCENTILE.INC(A2:A100,0.85)','=PERCENTRANK.INC(A2:A100,0.85)','=PERCENTILE.INC(A2:A100,85)','=QUARTILE.INC(A2:A100,0.85)'],
  a:[0], e:'PERCENTILE.INC (PERCENTIL.INC en Excel en español) recibe k entre 0 y 1. Con 85 devuelve error; PERCENTRANK hace el cálculo inverso (la posición de un valor), y QUARTILE sólo acepta 0 a 4.' },
{ id:'OF06', d:'o365', t:'s', q:'Necesitas colaborar en Teams con personas de otro equipo (o de otra organización) sin darles acceso al resto de tu equipo. ¿Qué usas?',
  o:['Un canal estándar','Un canal privado','Un canal compartido','Agregarlas como invitadas al equipo'],
  a:[2], e:'Los canales compartidos permiten sumar personas o equipos externos sólo a ese canal. Los privados restringen el acceso a miembros del propio equipo, y agregar invitados al equipo les da acceso a todos sus canales estándar.' },
{ id:'OF07', d:'o365', t:'s', q:'Quieres que la lista de acciones de la retrospectiva pueda editarse desde un chat de Teams y quede sincronizada en un correo de Outlook. ¿Qué funcionalidad lo permite?',
  o:['Un componente de Microsoft Loop','Un archivo de Word compartido desde OneDrive','Una pestaña de Planner agregada al chat','Una página de OneNote compartida'],
  a:[0], e:'Los componentes de Loop son bloques "vivos" que se editan y sincronizan dentro del propio chat de Teams o del correo de Outlook. Las otras opciones requieren abrir otra aplicación o no se insertan como contenido editable en el correo.' },
{ id:'OF08', d:'o365', t:'s', q:'Cada vez que alguien envía un formulario de "impedimento", quieres crear automáticamente una tarea en Planner y avisar en un canal de Teams. ¿Qué herramienta usas?',
  o:['Power Automate','Power Apps','Reglas de Outlook','Las notificaciones de Planner'],
  a:[0], e:'Power Automate conecta aplicaciones con flujos de disparador y acción (Forms → Planner → Teams) sin programar. Power Apps construye aplicaciones; las reglas de Outlook sólo actúan sobre correos.' },
{ id:'OF09', d:'o365', t:'s', q:'Para comunicar novedades de la transformación ágil a toda la organización, con noticias y páginas para pocos autores y muchos lectores, ¿qué es más adecuado?',
  o:['Un sitio de comunicación de SharePoint','Un sitio de grupo (team site) de SharePoint','Un canal estándar en un equipo de Teams de toda la organización','Un bloc de OneNote compartido con toda la organización'],
  a:[0], e:'Los sitios de comunicación están diseñados para difundir información a una audiencia amplia. Los sitios de grupo y los canales de Teams están pensados para colaborar dentro de un equipo.' },
{ id:'OF10', d:'o365', t:'s', q:'Facilitas un 1-2-4-All remoto en una reunión de Teams con 16 personas. ¿Qué funcionalidad de la reunión permite trabajar en parejas y grupos de cuatro y volver al plenario?',
  o:['Salas para grupos pequeños (breakout rooms)','Modo Juntos (Together mode)','Canales privados creados para cada grupo','Reuniones paralelas, una por grupo, desde el calendario'],
  a:[0], e:'Las salas para grupos pequeños dividen a los participantes y los devuelven a la sesión principal, algo clave para estructuras como 1-2-4-All. Las reuniones o canales paralelos obligan a salir y volver a entrar.' },
{ id:'OF11', d:'o365', t:'s', q:'Tienes en Excel una tabla de ítems terminados con su fecha de cierre. ¿Cuál es la forma más directa de obtener el throughput por semana?',
  o:['Un gráfico de dispersión con las fechas de cierre de cada ítem','Una tabla dinámica que agrupe la fecha de cierre por semana','BUSCARV sobre la fecha de cierre de cada ítem terminado','Un filtro automático por rango de fechas, contando cada semana'],
  a:[1], e:'Una tabla dinámica agrupada por fechas (en rangos de 7 días) con el recuento de ítems da el throughput semanal de forma inmediata y reutilizable; luego puede graficarse como serie temporal.' },
{ id:'OF12', d:'o365', t:'m', q:'¿Qué prácticas de colaboración en Microsoft Teams son recomendables para un equipo ágil?',
  o:['Organizar canales por tema o flujo de trabajo','Anclar como pestañas del canal el tablero, la wiki y los documentos clave','Usar el chat grupal para todo y los canales sólo para anuncios','Guardar los archivos en el OneDrive de cada persona y compartir enlaces en el chat'],
  a:[0,1], e:'Los canales temáticos dan contexto y facilitan la búsqueda; las pestañas acercan las herramientas a la conversación. El chat grupal pierde contexto y los archivos en OneDrive personal dependen de su dueño.' },
{ id:'OF13', d:'o365', t:'s', q:'Necesitas encontrar un horario común para un taller interno con 12 stakeholders de distintas áreas. ¿Qué funcionalidad de Outlook muestra su disponibilidad?',
  o:['El Asistente de programación (Scheduling Assistant)','Microsoft Bookings','La vista de calendario de grupo de Microsoft 365','Las respuestas automáticas de los invitados'],
  a:[0], e:'El Asistente de programación muestra la disponibilidad libre/ocupada de cada invitado y sugiere horarios en común. Bookings sirve para que otros reserven citas con un servicio, y el calendario de grupo muestra los eventos del grupo, no la disponibilidad de cada persona.' },

/* ---------------- Descubrimiento de producto ---------------- */
{ id:'DI01', d:'disc', t:'s', q:'¿Qué describe mejor el enfoque "Dual-Track Agile"?',
