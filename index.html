  o:['Un equipo de discovery valida ideas y entrega especificaciones a un equipo de delivery','Discovery y delivery ocurren en paralelo y de forma continua, con el mismo equipo involucrado','Un sprint de discovery seguido de varios sprints de delivery, de forma alternada','Un track para iniciativas estratégicas y otro para mantenimiento y bugs'],
  a:[1], e:'En Dual-Track (Desirée Sy, Jeff Patton, Marty Cagan) el discovery valida ideas mientras el delivery construye lo ya validado, en paralelo y con el mismo equipo. No son fases alternadas ni equipos separados con traspasos.' },
{ id:'DI02', d:'disc', t:'s', q:'En el Opportunity Solution Tree de Teresa Torres, ¿cuál es el orden de arriba hacia abajo?',
  o:['Resultado deseado → Oportunidades → Soluciones → Pruebas de supuestos','Oportunidad → Resultado deseado → Soluciones → Experimentos','Resultado deseado → Soluciones → Oportunidades → Experimentos','Visión → Resultado deseado → Soluciones → Métricas'],
  a:[0], e:'El árbol parte de un resultado medible, lo conecta con oportunidades (necesidades, dolores y deseos del cliente), luego con soluciones y finalmente con experimentos que prueban sus supuestos.' },
{ id:'DI03', d:'disc', t:'s', q:'¿Cuál de estos NO es uno de los cuatro grandes riesgos de producto según Marty Cagan?',
  o:['Valor: ¿lo comprarán o elegirán usarlo?','Usabilidad: ¿sabrán cómo usarlo?','Viabilidad del negocio: ¿funciona para el resto del negocio?','Adopción: ¿lo adoptará la organización internamente?'],
  a:[3], e:'Los cuatro riesgos de Cagan son valor, usabilidad, factibilidad (¿podemos construirlo?) y viabilidad del negocio. La "adopción interna" no es uno de ellos.' },
{ id:'DI04', d:'disc', t:'s', q:'¿Qué enunciado expresa mejor un "job" según Jobs To Be Done?',
  o:['Como contador de una pyme, quiero una conciliación automática para ahorrar tiempo','Cuando cierro el mes, quiero conciliar mis cobros rápido, para no perder la tarde con extractos','Contador de pyme, de 35 a 50 años, que usa Excel a diario y valora la rapidez','El usuario necesita una integración con su banco que exporte los movimientos a Excel'],
  a:[1], e:'JTBD se enfoca en el progreso que la persona busca en una situación concreta (cuando… quiero… para…), sin asumir la solución. La primera es una historia de usuario con solución incluida, la tercera es una persona y la cuarta, un requisito.' },
{ id:'DI05', d:'disc', t:'s', q:'Un equipo lleva 9 meses construyendo su "MVP" y todavía no lo mostró a ningún usuario. ¿Qué le dirías?',
  o:['Que es razonable si el producto es complejo: el MVP debe estar completo para competir','Que el MVP busca aprender con el mínimo esfuerzo: hay que validar ya la hipótesis más riesgosa','Que conviene lanzarlo a toda la base de clientes para maximizar los datos obtenidos','Que conviene recortar alcance para completar el MVP en tres meses más'],
  a:[1], e:'En Lean Startup, el MVP es la versión que permite el máximo aprendizaje validado con el menor esfuerzo; puede ser un prototipo, un landing o un concierge. Recortar alcance pero seguir sin validar no resuelve el problema.' },
{ id:'DI06', d:'disc', t:'s', q:'Siguiendo "The Mom Test" (Rob Fitzpatrick), ¿cuál es la mejor pregunta en una entrevista de discovery?',
  o:['¿Usarías una app que concilie tus pagos automáticamente?','¿Cuál es el mayor problema que tienes con la conciliación de pagos?','Cuéntame la última vez que conciliaste pagos: ¿qué hiciste y cuánto te llevó?','Del 1 al 10, ¿qué tan útil te parecería una conciliación automática?'],
  a:[2], e:'The Mom Test recomienda preguntar por comportamientos pasados y concretos. Las hipotéticas y las valoraciones generan respuestas complacientes, y "¿cuál es tu mayor problema?" invita a generalizar opiniones.' },
{ id:'DI07', d:'disc', t:'s', q:'¿Cuál es el orden de las etapas de Design Thinking según la d.school de Stanford?',
  o:['Empatizar, Definir, Idear, Prototipar, Testear','Definir, Empatizar, Idear, Prototipar, Testear','Empatizar, Idear, Definir, Prototipar, Testear','Empatizar, Definir, Prototipar, Idear, Testear'],
  a:[0], e:'Empatizar → Definir → Idear → Prototipar → Testear. En la práctica el proceso es iterativo y se vuelve a etapas anteriores según lo aprendido.' },
{ id:'DI08', d:'disc', t:'s', q:'En el Doble Diamante (Design Council), ¿qué fases componen el primer diamante?',
  o:['Descubrir y Definir: explorar y acotar el problema','Descubrir y Desarrollar: explorar el problema y generar soluciones','Definir y Desarrollar: priorizar el problema y diseñar la solución','Desarrollar y Entregar: prototipar y lanzar la solución'],
  a:[0], e:'Primer diamante: Discover y Define (diverger y converger sobre el problema). Segundo diamante: Develop y Deliver (diverger y converger sobre la solución).' },
{ id:'DI09', d:'disc', t:'s', q:'En un Assumption Mapping (David Bland), ¿qué supuestos conviene testear primero?',
  o:['Los poco importantes y con mucha evidencia','Los muy importantes y con poca evidencia','Los poco importantes y con poca evidencia','Los muy importantes y con mucha evidencia'],
  a:[1], e:'Los supuestos críticos para el éxito y con poca evidencia son los "saltos de fe": si son falsos, la idea cae. Los importantes con mucha evidencia ya están razonablemente validados.' },
{ id:'DI10', d:'disc', t:'s', q:'En un User Story Map (Jeff Patton), ¿para qué sirven los cortes horizontales (release slices)?',
  o:['Para agrupar las historias por componente técnico y facilitar su asignación','Para definir el mínimo conjunto de historias que recorre todo el flujo y logra un resultado','Para ordenar las actividades del backbone según la secuencia del usuario','Para separar, dentro de cada actividad, las historias de mayor y menor prioridad'],
  a:[1], e:'El backbone se ordena de izquierda a derecha según el recorrido del usuario; cada corte horizontal agrupa lo mínimo necesario a lo largo de todo ese recorrido para lograr un resultado, evitando entregas por capas técnicas.' },
{ id:'DI11', d:'disc', t:'s', q:'Antes de construir una funcionalidad premium, el equipo agrega un botón "Activar premium" que lleva a un mensaje de "próximamente" y mide cuántos lo pulsan. ¿Qué técnica es?',
  o:['A/B testing','Fake door','Concierge MVP','Wizard of Oz'],
  a:[1], e:'El fake door mide la demanda real antes de construir. En el Concierge y el Wizard of Oz el cliente recibe el servicio (hecho a mano, abiertamente o detrás de una interfaz), y el A/B testing compara variantes existentes.' },
{ id:'DI12', d:'disc', t:'m', q:'¿Qué señales indican que el discovery es "teatro" y no un aprendizaje real?',
  o:['Las decisiones de producto ya estaban tomadas antes de investigar','Sólo el PO habla con clientes y luego entrega requisitos cerrados al equipo','Se prueban supuestos con prototipos de baja fidelidad antes de construir','Las entrevistas se enfocan en comportamientos pasados de los clientes'],
  a:[0,1], e:'Si la decisión ya estaba tomada, la investigación sólo busca confirmarla. Teresa Torres propone que el trío de producto (producto, diseño, ingeniería) participe del contacto con clientes. Las otras dos son prácticas sanas.' },
{ id:'DI13', d:'disc', t:'s', q:'¿Cuál de estas hipótesis está mejor formulada para un experimento?',
  o:['Creemos que el nuevo checkout mejorará la experiencia de compra y, en consecuencia, aumentará las ventas del canal digital','Creemos que mostrar el costo total antes del pago bajará el abandono de carrito de clientes nuevos del 70% al 60% en 4 semanas','Si mostramos el costo total antes del pago a todos los clientes, bajará el abandono del carrito en el checkout','Creemos que los clientes nuevos abandonan por el costo de envío; lo validaremos con entrevistas en profundidad'],
  a:[1], e:'Una hipótesis testeable define el cambio, el segmento, la métrica, el umbral y el plazo, de modo que pueda confirmarse o refutarse. Las demás carecen de métrica, umbral o plazo.' },
{ id:'DI14', d:'disc', t:'s', q:'Según el modelo Kano, ¿cómo se clasifica una funcionalidad que el cliente no espera, que genera entusiasmo cuando está, pero cuya ausencia no genera insatisfacción?',
  o:['Básica (must-be)','De desempeño (lineal)','Atractiva (delighter)','Indiferente'],
  a:[2], e:'Kano: las básicas generan insatisfacción si faltan; las de desempeño aumentan la satisfacción proporcionalmente; las atractivas sorprenden; las indiferentes no influyen. Con el tiempo, las atractivas tienden a volverse básicas.' },
{ id:'DI15', d:'disc', t:'s', q:'Según Teresa Torres, ¿qué caracteriza al "Continuous Discovery"?',
  o:['Un ciclo de investigación al inicio de cada trimestre, alineado con los OKRs','Contacto al menos semanal con clientes, del propio equipo que construye','Encuestas continuas dentro del producto, analizadas por el equipo de research','Pruebas de usabilidad antes de cada release, realizadas por el equipo de UX'],
  a:[1], e:'La definición de Torres: "al menos semanalmente, puntos de contacto con clientes, del equipo que construye el producto, realizando pequeñas actividades de investigación en busca de un resultado deseado".' },
{ id:'DI16', d:'disc', t:'s', q:'¿Cuál es el propósito del Inception de producto en el modelo?',
  o:['Aprobar el presupuesto, el caso de negocio y las capacidades de la iniciativa','Reducir la incertidumbre, explicitar riesgos y alinear expectativas para construir el backlog','Identificar las dependencias entre todos los squads de la tribu para el próximo trimestre','Validar el incremento con clientes reales antes de liberarlo de forma masiva'],
  a:[1], e:'El Inception (inspirado en Inception Deck y Lean Inception) reúne al squad, negocio y stakeholders para enfocarse en un mismo objetivo, reducir incertidumbre y producir el insumo del Product Backlog. Aprobar capacidades es propio de la QBR e identificar dependencias de la tribu, del Big Room Planning.' },
{ id:'DI17', d:'disc', t:'s', q:'En el Product Vision Board, ¿en qué sección se responde "¿Qué problema soluciona este producto y qué beneficios trae?"',
  o:['Grupo objetivo','Necesidades','Producto','Objetivos de negocio'],
  a:[1], e:'El Product Vision Board tiene una Visión y cuatro bloques: Grupo objetivo (quiénes lo usarán), Necesidades (qué problema resuelve y qué beneficios trae), Producto (funcionalidades principales y diferenciales) y Objetivos de negocio (cómo beneficia a la compañía).' },
{ id:'DI18', d:'disc', t:'s', q:'Durante el Inception, el squad decide que un riesgo no será resuelto y lo tratará como una restricción. ¿Cómo se clasifica?',
  o:['Resuelto','Asignado','Aceptado','Mitigado'],
  a:[2], e:'Los riesgos identificados se clasifican en cuatro estados: Resuelto (el equipo decide que no existe), Asignado (alguien se apropia de resolverlo), Aceptado (se asume como restricción) y Mitigado (hay un plan que reduce su impacto).' },
{ id:'DI19', d:'disc', t:'s', q:'Un squad en operación continuará el próximo trimestre una iniciativa conocida, aprobada en la QBR y con baja incertidumbre. ¿Qué actividad corresponde?',
  o:['Un Inception completo de cinco días con todo el squad','Un Descubrimiento de Producto/Servicio con los siete frentes','La Actualización del Release Plan (día y medio)','Un nuevo Kick-off de lanzamiento del squad con el sponsor'],
  a:[2], e:'El árbol de decisión del diseño de iniciativas indica que, para una iniciativa que continúa o con baja incertidumbre, basta con actualizar el Release Plan: un subconjunto del Inception (USM, release plan, dependencias, estimación, DoR/DoD y refinamiento) en día y medio.' },

/* ---------------- DevOps (recomendable) ---------------- */
{ id:'DV01', d:'devops', t:'m', q:'¿Cuáles son las cuatro métricas clave de DORA para medir el desempeño de entrega de software?',
  o:['Frecuencia de despliegue','Lead time de cambios','Tasa de fallos de cambios','Tiempo de recuperación ante un fallo','Tiempo medio entre fallos (MTBF)','Cobertura de pruebas automatizadas'],
  a:[0,1,2,3], e:'DORA (Accelerate) mide el throughput (frecuencia de despliegue, lead time de cambios) y la estabilidad (tasa de fallos de cambios, tiempo de recuperación). MTBF y cobertura no forman parte de las cuatro claves.' },
{ id:'DV02', d:'devops', t:'s', q:'¿Qué significa el acrónimo CALMS en DevOps?',
  o:['Culture, Automation, Lean, Measurement, Sharing','Culture, Automation, Lean, Monitoring, Security','Collaboration, Automation, Lean, Measurement, Sharing','Culture, Agility, Lean, Measurement, Sharing'],
  a:[0], e:'CALMS (Jez Humble, Damon Edwards, John Willis) es un marco para evaluar la adopción de DevOps: Cultura, Automatización, Lean, Medición y Compartir.' },
{ id:'DV03', d:'devops', t:'s', q:'¿Cuáles son "Las Tres Vías" (The Three Ways) descritas en The Phoenix Project y The DevOps Handbook?',
  o:['Flujo, retroalimentación, y aprendizaje y experimentación continuos','Flujo, automatización de la entrega y medición del desempeño','Colaboración entre Dev y Ops, automatización y mejora continua','Integración continua, entrega continua y despliegue continuo'],
  a:[0], e:'Primera vía: optimizar el flujo de izquierda a derecha. Segunda: amplificar el feedback de derecha a izquierda. Tercera: cultura de experimentación y aprendizaje continuo.' },
{ id:'DV04', d:'devops', t:'s', q:'¿Cuál es la diferencia entre Continuous Delivery y Continuous Deployment?',
  o:['Continuous Delivery automatiza hasta el entorno de pruebas; Continuous Deployment, hasta producción','En Delivery cada cambio queda listo para producción y se libera por decisión; en Deployment se despliega automáticamente','Continuous Delivery integra el código varias veces al día; Continuous Deployment lo lleva a producción','Son equivalentes; la diferencia es sólo de nomenclatura entre proveedores de herramientas'],
  a:[1], e:'Ambas requieren que cada cambio sea desplegable a producción. La diferencia es si el paso a producción es una decisión de negocio (Delivery) o automático (Deployment). Integrar varias veces al día es Continuous Integration.' },
{ id:'DV05', d:'devops', t:'s', q:'En la estrategia de branches GitFlow definida en el playbook, ¿qué rama contiene el código desplegado en producción y cuál se usa para corregir errores productivos?',
  o:['Development y Feature','Main y Hotfix','Release y Hotfix','Main y Release'],
  a:[1], e:'Main contiene el código del artefacto desplegado en producción; Hotfix corrige errores productivos y sus cambios deben propagarse a Development. Release genera los artefactos de staging (pruebas de QA) y Feature son ramas temporales por funcionalidad.' },
{ id:'DV06', d:'devops', t:'s', q:'¿Qué permiten principalmente los feature flags (feature toggles)?',
  o:['Separar el despliegue (deploy) de la liberación (release) a los usuarios','Eliminar por completo la necesidad de ramas en el control de versiones','Revertir cambios de esquema de base de datos sin downtime','Ejecutar las pruebas automatizadas sólo sobre las funcionalidades activas'],
  a:[0], e:'Con feature flags el código se despliega desactivado y se libera de forma gradual o por segmento, lo que habilita experimentos y apagado inmediato. No resuelven las migraciones de datos y requieren limpieza para no acumular deuda.' },
{ id:'DV07', d:'devops', t:'s', q:'Tras una caída en producción, el gerente quiere identificar "quién tuvo la culpa". ¿Qué práctica propondrías?',
  o:['Un análisis de causa raíz que identifique el error humano para reforzar la capacitación','Un postmortem sin culpables, centrado en las causas sistémicas y las mejoras','Agregar una aprobación del comité de cambios (CAB) a todos los despliegues','Documentar el incidente y asignar la acción correctiva a la persona involucrada'],
  a:[1], e:'Los postmortems blameless generan seguridad para contar lo que pasó realmente. Detenerse en el "error humano" oculta las causas del sistema, y más aprobaciones suelen empeorar el lead time sin mejorar la estabilidad (según DORA).' },
{ id:'DV08', d:'devops', t:'s', q:'¿Qué significa "shift left" en el contexto de calidad y seguridad?',
  o:['Incorporar pruebas y controles de seguridad lo antes posible en el ciclo','Trasladar responsabilidades de operación y guardia al equipo de desarrollo','Priorizar las pruebas de extremo a extremo sobre las pruebas unitarias','Asignar un equipo de calidad independiente desde el inicio del proyecto'],
  a:[0], e:'Detectar defectos y vulnerabilidades temprano es más barato. DevSecOps integra la seguridad en el pipeline (SAST, análisis de dependencias). Que desarrollo opere sus servicios es "you build it, you run it", otro concepto.' },
{ id:'DV09', d:'devops', t:'s', q:'Un cambio tarda 30 días desde el commit hasta producción, pero sólo hay 2 días de trabajo efectivo. ¿Qué técnica ayuda más a encontrar dónde está la demora?',
  o:['Value Stream Mapping del flujo de entrega','Diagrama de Ishikawa sobre la demora','Análisis de Pareto de los defectos','Medición de la velocidad del equipo'],
  a:[0], e:'El Value Stream Mapping visualiza cada etapa con su tiempo de proceso y su tiempo de espera, y hace evidentes los traspasos, colas y aprobaciones que alargan el lead time. Ishikawa ayuda a explorar causas, pero no mide dónde se acumula la espera.' },
{ id:'DV10', d:'devops', t:'s', q:'Un servicio tiene un SLO de disponibilidad del 99,9% mensual y ya consumió todo su error budget. Según la práctica de SRE, ¿qué corresponde?',
  o:['Seguir lanzando funcionalidades, reforzando las pruebas manuales antes de cada despliegue','Priorizar el trabajo de confiabilidad y frenar los cambios riesgosos hasta recuperar el presupuesto','Ajustar el SLO al 99,5% para reflejar la realidad actual del servicio','Escalar la infraestructura para absorber la carga y continuar con el roadmap'],
  a:[1], e:'El error budget (100% − SLO) equilibra innovación y estabilidad: mientras hay presupuesto se puede arriesgar; cuando se agota, la prioridad pasa a la confiabilidad. Bajar el SLO para "cumplir" desvirtúa el acuerdo.' },
{ id:'DV11', d:'devops', t:'s', q:'¿Qué describe un despliegue canary?',
  o:['Exponer la nueva versión a un pequeño porcentaje de usuarios y ampliarla gradualmente','Mantener dos entornos idénticos y conmutar todo el tráfico de uno a otro','Reemplazar las instancias de a una hasta actualizar todo el clúster','Desplegar el código desactivado y activarlo después mediante un flag'],
  a:[0], e:'Canary limita el impacto de un problema a una porción de usuarios. Las otras opciones describen blue-green, rolling update y dark launch, respectivamente.' },
{ id:'DV12', d:'devops', t:'s', q:'¿Qué es Infraestructura como Código (IaC)?',
  o:['Definir y aprovisionar la infraestructura mediante archivos declarativos versionados y ejecutables','Automatizar la creación de servidores con scripts que operaciones ejecuta manualmente','Documentar la arquitectura de infraestructura en el repositorio junto al código','Usar servicios administrados en la nube para no gestionar infraestructura'],
  a:[0], e:'IaC (Terraform, Bicep, CloudFormation) crea entornos reproducibles, permite revisar cambios con pull requests y evita la deriva de configuración. Scripts ejecutados a mano o documentación no cumplen esas propiedades.' },
{ id:'DV13', d:'devops', t:'m', q:'¿Cuáles de estos son antipatrones comunes al adoptar DevOps?',
  o:['Que un equipo DevOps ejecute todos los despliegues por los squads, convirtiéndose en un nuevo traspaso sin transferir capacidades','Hacer despliegues grandes y poco frecuentes para "reducir el riesgo"','Que el equipo que desarrolla un servicio participe de su guardia operativa','Desplegar varias veces al día en horario laboral'],
  a:[0,1], e:'DevOps es responsabilidad compartida. Un equipo (o CoE) de DevOps habilita con pipelines, estándares y transferencia de capacidades, pero si ejecuta todo por los squads se vuelve un silo. Los lotes grandes aumentan el riesgo; "you build it, you run it" y desplegar a menudo son buenas prácticas.' },
{ id:'DV14', d:'devops', t:'s', q:'Según el versionado semántico (Semantic Versioning) adoptado, una nueva versión rompe la compatibilidad hacia atrás de una API. ¿Qué número debe incrementarse?',
  o:['MAJOR','MINOR','PATCH','LABEL'],
  a:[0], e:'MAJOR.MINOR.PATCH: MAJOR para cambios que rompen la compatibilidad, MINOR para nuevas funcionalidades compatibles y PATCH para correcciones sin funcionalidades nuevas. El LABEL es opcional e indica pre-releases o ramas (alpha, rc).' },
{ id:'DV15', d:'devops', t:'s', q:'¿Qué tipo de pipeline valida la integridad del build y la ausencia de errores de compilación, sin generar artefactos ni requerir aprobación?',
  o:['Build Validation (BV)','Continuous Integration (CI)','Continuous Delivery (CD)','Release pipeline de staging'],
  a:[0], e:'El playbook define tres tipos: Build Validation (valida el build, no genera artefacto), Continuous Integration (compila, prueba y empaqueta artefactos) y Continuous Delivery (despliega los artefactos en los distintos ambientes).' },
{ id:'DV16', d:'devops', t:'s', q:'¿Quién aprueba la ejecución del pipeline cuando se hace un pull request de la rama Release hacia Main (ambiente de producción)?',
  o:['El equipo de desarrollo, ya que la rama Release ya fue validada por QA en staging','El Chapter Lead de desarrollo, QA y el PO, sin reemplazar la gestión de cambios del banco','El CoE de DevOps, responsable de configurar y ejecutar todos los pipelines del banco','El Scrum Master y el Agile Coach, como garantes del cumplimiento metodológico'],
  a:[1], e:'Hacia Main se requiere la aprobación del Chapter Lead de desarrollo, QA y el PO. Esa aprobación es de la ejecución del pipeline: si modifica producción, además debe cumplirse la normativa de gestión de cambios vigente, que no se reemplaza.' },
{ id:'DV17', d:'devops', t:'s', q:'Un squad necesita un nuevo repositorio de código y su pipeline. Según el playbook, ¿cómo se gestiona?',
  o:['Cada Developer crea el repositorio y su pipeline en Azure DevOps cuando lo necesita','Se solicita al CoE de DevOps mediante un ticket en ServiceNow','Lo crea el Product Owner desde Azure Boards al aprobar la historia que lo requiere','Se solicita en el Big Room Planning y lo crea la fábrica de software asignada'],
  a:[1], e:'La creación y configuración de repositorios y pipelines está a cargo del CoE de DevOps mediante tickets en ServiceNow. Los arquitectos de solución, junto con los Chapter Leads, definen cuántos repositorios crear (uno por artefacto) siguiendo la convención de nombres.' },

/* ---------------- Squads, tribus, chapters, CoE y foros (modelo BCG) ---------------- */
{ id:'SC01', d:'scale', t:'s', q:'En el modelo operativo, ¿cuál es la responsabilidad principal del Chapter Lead?',
  o:['Definir y priorizar el backlog de los squads donde trabajan los miembros de su chapter','Liderar su disciplina: estándares, staffing, formación y evaluación de sus miembros','Coordinar las dependencias entre squads de la tribu y facilitar el Big Room Planning','Responder por los resultados de negocio de la tribu y distribuir la capacidad entre squads'],
  a:[1], e:'El Chapter Lead es líder jerárquico y funcional de hasta 10–15 especialistas desplegados en squads: asegura estándares y lineamientos ("el cómo"), asigna perfiles a los squads, apoya la selección, impulsa la formación y evalúa el desempeño. El backlog lo prioriza el PO y el BRP lo facilita el Agile Coach.' },
{ id:'SC02', d:'scale', t:'s', q:'¿Cuál es el rol del Tribe Lead?',
  o:['Alinear y coordinar los squads a través de los POs: dirección, iniciativas, dependencias y riesgos','Acompañar a los squads como coach, responsable de su madurez ágil y de la facilitación de sus eventos','Liderar técnicamente la tribu, definiendo la arquitectura y los estándares de todas las disciplinas','Actuar como Product Owner del squad más crítico y representar a los demás POs ante la dirección'],
  a:[0], e:'El Tribe Lead alinea y coordina a los squads mediante los Product Owners para impactar los objetivos estratégicos: fija dirección, mantiene el alineamiento, define iniciativas, gestiona dependencias y riesgos y aprovecha sinergias. La madurez ágil es foco del Agile Coach y los estándares técnicos, de los chapters.' },
{ id:'SC03', d:'scale', t:'s', q:'¿Qué es un Centro de Excelencia (CoE) en el modelo?',
  o:['Una comunidad voluntaria de práctica, abierta a toda la organización, sobre un tema de interés común','Especialistas con expertise escaso, no desplegados en squads, que apoyan ad-hoc y definen lineamientos','Especialistas de una misma disciplina desplegados en los squads, liderados por un Chapter Lead','Un área de soporte que mantiene su estructura original y apoya puntualmente, sin responsabilidad de entrega'],
  a:[1], e:'El CoE reúne expertise escaso (por ejemplo Cloud o DevOps), con un CoE Lead y no más de ~15 miembros no desplegados. Apoya a los squads bajo demanda, crea assets y lineamientos transversales, evoluciona la práctica y transfiere capacidades. La tercera opción describe un chapter y la cuarta, una función de soporte.' },
{ id:'SC04', d:'scale', t:'s', q:'Una práctica es requerida de forma recurrente, pero no a diario, por varios squads y hay pocos especialistas en el banco. ¿Cómo conviene agruparla?',
  o:['Como chapter, desplegando un especialista fijo en cada uno de los squads que la usan','Como CoE, con apoyo ad-hoc a los squads y definición de lineamientos de la práctica','Como función de soporte, sin participación en los eventos ni en el Big Room Planning','Como squad independiente que recibe y prioriza los pedidos de los demás squads'],
  a:[1], e:'El playbook recomienda el chapter para prácticas de alta demanda en el trabajo diario y con perfiles suficientes para dedicarlos a los squads; el CoE, para prácticas requeridas recurrentemente pero no a diario y con perfiles altamente escasos.' },
{ id:'SC05', d:'scale', t:'s', q:'Una desarrolladora trabaja en el squad de Tarjetas de Crédito y pertenece al chapter de Desarrollo Digital. ¿Cómo se reparten las responsabilidades sobre ella?',
  o:['El PO define en qué trabaja; el Chapter Lead vela por el cómo y también la evalúa','El Chapter Lead define en qué trabaja; el PO evalúa su desempeño técnico en el squad','El Tribe Lead define en qué trabaja y la evalúa, con aportes del PO y del Chapter Lead','El PO es su jefe directo para todo efecto; el chapter es sólo una comunidad de práctica'],
  a:[0], e:'Es una matriz: el PO define "el qué" (prioridades del squad) y el chapter define "el cómo". Los miembros del chapter se evalúan por el cumplimiento de los resultados de los squads y, además, por su Chapter Lead, y mantienen el vínculo con su área funcional.' },
{ id:'SC06', d:'scale', t:'s', q:'¿Cuáles son las principales responsabilidades de la QBR (Quarterly Business Review)?',
  o:['Identificar dependencias técnicas y de negocio entre squads y ajustar los release plans','Evaluar resultados y aprobar las iniciativas y capacidades de cada squad para el trimestre','Demostrar el incremento consolidado del trimestre y recibir feedback de los stakeholders','Revisar cada semana el progreso de los squads, sus métricas, riesgos e impedimentos'],
  a:[1], e:'La QBR (trimestral, ~4 h, con Gerencia General, gerencias, Tribe Leads y POs) socializa la generación de valor, aprueba las iniciativas de cada squad según su impacto y aprueba la asignación de capacidades. Las dependencias se trabajan en el Big Room Planning y el seguimiento semanal en la Sincronización de Tribu.' },
{ id:'SC07', d:'scale', t:'s', q:'Según el modelo, ¿qué caracteriza a un squad?',
  o:['Un equipo armado para un proyecto, con fecha de inicio y fin, que se disuelve al entregarlo','Un equipo dedicado, multidisciplinario y end-to-end de ~12 personas, con PO y SM','Un equipo de especialistas de una misma disciplina que atiende pedidos de varias tribus','Un equipo de hasta 5 personas cuyos miembros se reasignan cada trimestre según la demanda'],
  a:[1], e:'El squad es la mínima unidad operativa: equipo multidisciplinario de ~12 personas con las disciplinas necesarias para minimizar dependencias, con PO dedicado (el qué) y SM, autonomía en el cómo y duración indefinida. Los equipos que se disuelven al final son propios de los proyectos tradicionales.' },
{ id:'SC08', d:'scale', t:'s', q:'¿Cuál es la composición típica de una tribu según el modelo?',
  o:['Entre 2 y 4 squads y hasta 40 personas','Entre 5 y 15 squads y de 50 a 150 personas','Entre 15 y 30 squads y de 150 a 300 personas','No hay rango: depende del presupuesto de la línea de negocio'],
  a:[1], e:'La tribu agrupa squads con misiones relacionadas y un propósito común; su composición típica es de 5 a 15 squads y de 50 a 150 FTEs, liderados por un Tribe Lead. El límite superior se relaciona con el número de Dunbar.' },
{ id:'SC09', d:'scale', t:'s', q:'¿Cuál de estas responsabilidades corresponde al Agile Coach en los foros de la tribu?',
  o:['Aprobar las iniciativas y la asignación de capacidades de cada squad en la QBR','Ser responsable del Big Room Planning y facilitar la Sincronización de Tribu','Evaluar el desempeño de los Scrum Masters y POs de la tribu junto al Tribe Lead','Liderar la Sprint Review de cada squad y aceptar los incrementos terminados'],
  a:[1], e:'El Agile Coach es el responsable del BRP (con apoyo de la Oficina de Transformación), facilita la Sincronización de Tribu y acompaña a Chapter Leads y CoEs en sus foros. La aprobación de iniciativas es de la QBR y la aceptación de incrementos, del PO.' },
{ id:'SC10', d:'scale', t:'s', q:'Un banco renombró sus gerencias como tribus y sus áreas como squads, pero mantiene proyectos con PM, equipos que se disuelven al terminar y presupuesto por proyecto. ¿Cuál es el problema de fondo?',
  o:['Que faltan Chapter Leads dedicados en cada squad para asegurar la calidad técnica','Que se copió la estructura sin cambiar cómo se financia, gobierna y decide','Que los squads deberían tener al menos 15 personas para cubrir todas las disciplinas','Que faltan CoEs por especialidad que coordinen el trabajo de los proyectos'],
  a:[1], e:'Los productos digitales trabajan con equipos de duración indefinida, con misión, y valor que se captura incrementalmente; las capacidades se aprueban en la QBR. Renombrar áreas sin cambiar cómo se financia, gobierna y decide es "cargo cult".' },
{ id:'SC11', d:'scale', t:'s', q:'¿Cuál es el objetivo principal del Big Room Planning (BRP)?',
  o:['Aprobar las iniciativas del trimestre y la asignación de capacidades por squad','Identificar y gestionar dependencias, asegurando la viabilidad de lo aprobado en la QBR','Demostrar el incremento consolidado del trimestre a los stakeholders ampliados','Revisar y recalibrar los OKRs anuales del banco junto a la Junta Directiva'],
  a:[1], e:'El BRP (trimestral, ~2 días para ~10 squads) toma las decisiones de la QBR, los backlogs y release plans, y busca identificar dependencias y riesgos, generar planes de acción y alinear a sponsors, CoEs, Chapter Leads, áreas de soporte y proveedores. La aprobación de iniciativas y capacidades es de la QBR.' },
{ id:'SC12', d:'scale', t:'s', q:'¿Qué significa "alineamiento alto, autonomía alta" en este modelo?',
  o:['El Tribe Lead define qué hacer, los Chapter Leads cómo hacerlo, y el squad ejecuta','Los responsables del "qué" dan contexto y prioridades; el squad decide el cómo','Cada squad define su estrategia y sus objetivos, y luego el liderazgo los consolida','Los squads deciden el cómo, siempre que respeten un plan anual de entregables fijo'],
  a:[1], e:'La autonomía sin alineamiento genera caos; el alineamiento sin autonomía, micromanagement. Los responsables del qué (Tribe Lead, PO) dan dirección y prioridades; el squad, multifuncional, tiene autonomía en el cómo, dentro de los estándares que aportan chapters y CoEs.' },
{ id:'SC13', d:'scale', t:'s', q:'El playbook evalúa dos opciones para el Chapter Lead. ¿Cuál es la recomendada y por qué?',
  o:['Dentro de un squad, porque mantiene el foco técnico y conoce de cerca el trabajo diario','Dedicado al 100%, porque permite chapters más grandes y foco en gestión de personas','Rotativo, elegido por los miembros cada trimestre para distribuir el liderazgo','Compartido entre varias disciplinas, para minimizar la cantidad de perfiles de liderazgo'],
  a:[1], e:'La opción recomendada es el Chapter Lead dedicado: no pertenece a un squad, lidera chapters de 10–15 miembros y se orienta a la gestión de personas. El Chapter Lead dentro de un squad conviene para chapters pequeños (5–10) y con inclinación más técnica.' },
{ id:'SC14', d:'scale', t:'m', q:'¿Qué afirmaciones sobre Chapters y CoEs son correctas según el modelo?',
  o:['Los miembros del chapter están desplegados en los squads','Los miembros del CoE apoyan a los squads con dedicación ad-hoc, sin estar desplegados en ellos','El CoE es idóneo para prácticas de alta demanda en el trabajo diario de los squads','El alcance del chapter es transversal a toda la organización, incluso fuera de los squads ágiles'],
  a:[0,1], e:'El chapter despliega a sus miembros en los squads y es idóneo para prácticas de alta demanda diaria, con alcance dentro de los squads. El CoE apoya ad-hoc sin estar desplegado, con alcance transversal a toda la organización, incluso fuera de los squads.' },
{ id:'SC15', d:'scale', t:'s', q:'¿Qué caracteriza al Product Owner de un squad en el modelo?',
  o:['Un líder de TI que traduce los requerimientos del negocio a especificaciones técnicas','Dedicado, máxima autoridad de priorización del backlog y voz del cliente','Comparte su tiempo entre varios squads y delega la priorización en el Scrum Master','Su principal responsabilidad es reportar el avance a la Oficina de Transformación'],
  a:[1], e:'El PO está dedicado y 100% disponible para el equipo, representa al cliente y a los interesados, es la autoridad máxima en la priorización del backlog, lidera el refinamiento y gestiona el release plan buscando maximizar el valor.' },
{ id:'SC16', d:'scale', t:'s', q:'¿Cómo se asigna la capacidad de los squads en este modelo?',
  o:['Por proyecto, con un business case aprobado y un equipo que se disuelve al finalizar','Squads estables con iniciativas y capacidades aprobadas cada trimestre en la QBR','Por horas consumidas por cada squad, facturadas internamente a las áreas de negocio','Con un presupuesto anual fijo por chapter, que asigna personas a los proyectos aprobados'],
  a:[1], e:'La QBR aprueba trimestralmente las iniciativas de cada squad y la asignación de capacidades para asegurar costo/beneficio. Los squads son estables y de duración indefinida; no se arman ni desarman por proyecto.' },
{ id:'SC17', d:'scale', t:'s', q:'¿Qué caracteriza a las Funciones de Soporte (por ejemplo, Legal, Procesos o Crédito y Riesgo) dentro del modelo?',
  o:['Se integran como miembros dedicados de cada squad que requiere su especialidad','Mantienen su estructura y liderazgo, y apoyan puntualmente sin responsabilidad de entrega','Se convierten en chapters, con un Chapter Lead propio desplegado en los squads','Adoptan Scrum y participan obligatoriamente en todos los eventos de los squads'],
  a:[1], e:'Las funciones de soporte dan apoyo puntual y transversal (servicios, revisión de soluciones, lineamientos, participación en eventos a demanda) sin ser responsables de la entrega. Mantienen su estructura y forma de trabajo, y pueden evolucionar a CoE si crece la demanda.' },
{ id:'SC18', d:'scale', t:'m', q:'¿En qué eventos de los squads es obligatoria la participación del CoE?',
  o:['Big Room Planning','Descubrimiento de producto (Product Discovery)','Sprint Review','Daily Scrum'],
  a:[0,1], e:'Para el CoE, el Big Room Planning y el Descubrimiento de producto son obligatorios; Sprint Planning y Refinamiento son a demanda, y la Sprint Review, opcional. No participa de la Daily del squad.' },
{ id:'SC19', d:'scale', t:'s', q:'¿Con qué frecuencia se realiza la Sincronización de Tribu y qué se revisa en ella?',
  o:['Mensualmente, para revisar capacidades y aprobar las nuevas iniciativas de los squads','Semanalmente, para revisar objetivos, métricas, capacidad y dependencias críticas','Diariamente, como una Daily de los POs para coordinar las dependencias del día','Quincenalmente, al cierre de cada sprint, junto con la Sprint Review de la tribu'],
  a:[1], e:'La Sincronización de Tribu es semanal (~3 h), la lidera el Tribe Lead y la facilita el Agile Coach. Revisa avance de objetivos, métricas, capacidad y dependencias críticas; quincenalmente incluye la priorización con Chapter Leads y mensualmente con los CoEs.' },
{ id:'SC20', d:'scale', t:'s', q:'Para los chapters de desarrollo, el playbook compara un chapter generalista con chapters especializados (Digital, Core Libra, Core Sistar). ¿Cuál se recomienda y por qué?',
  o:['Generalista, porque centraliza el control en un único Chapter Lead y minimiza perfiles','Especializados, porque líderes con dominio profundo de cada tecnología reducen el riesgo','Generalista, porque evita la coordinación entre chapters y da una visión integrada','Especializados, porque reducen el costo de perfiles dedicados frente al generalista'],
  a:[1], e:'Se recomiendan chapters especializados para reducir riesgos: permiten un control técnico más exhaustivo en sistemas críticos. Como desventaja, requieren más perfiles dedicados (costo) y coordinación entre chapters; el generalista minimiza perfiles pero es muy difícil encontrar un líder que domine todas las tecnologías.' },
{ id:'SC21', d:'scale', t:'s', q:'¿Cómo se realiza la Sprint Review a nivel de la Tribu Digital?',
  o:['Cada squad la hace por separado, sólo con su PO, su equipo y sus stakeholders directos','En conjunto, cada quince días, con una demo consolidada en la última del trimestre','Se reemplaza por la QBR, donde se demuestra el trabajo realizado en todo el trimestre','Una vez por mes, con la Junta Directiva y el Comité Ejecutivo como audiencia'],
  a:[1], e:'Quincenalmente los squads de la tribu demuestran juntos su incremento, reciben feedback y alinean próximos pasos (~3 h). En la última Sprint Review del trimestre se muestra una demo consolidada de todo lo construido, con invitación ampliada a stakeholders.' }
];

/* ============================================================================
   APLICACIÓN
   ========================================================================== */
(function () {
  'use strict';

  const SEC_PER_Q = 120;
  const PASS = 70;
  const MIN_Q = 10, MAX_Q = 60;
  const K = { hist: 'acx.v1.history', cur: 'acx.v1.current', theme: 'acx.v1.theme', last: 'acx.v1.lastCoach' };

  const BYID = Object.create(null);
  BANK.forEach(q => { BYID[q.id] = q; });
  const DIM = Object.create(null);
  DIMS.forEach(d => { DIM[d.id] = d; });

  // localStorage puede no estar disponible (modo privado, file:// restringido); todo va envuelto.
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } },
    del(k) { try { localStorage.removeItem(k); } catch (e) {} }
  };

  const app = document.getElementById('app');
  const topbar = document.getElementById('topbar');
  let timerId = null;
  let exam = null;          // examen en curso
  let reviewFilter = { kind: 'all', dim: 'all' };

  /* ---------- utilidades ---------- */
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const coachKey = n => n.trim().replace(/\s+/g, ' ').toLocaleLowerCase('es');
  const cleanName = n => n.trim().replace(/\s+/g, ' ');
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  const fmtClock = ms => { const s = Math.max(0, Math.ceil(ms / 1000)); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), ss = s % 60; return (h ? h + ':' + String(m).padStart(2, '0') : String(m).padStart(2, '0')) + ':' + String(ss).padStart(2, '0'); };
  const fmtDur = ms => { const m = Math.floor(ms / 60000), s = Math.round(ms % 60000 / 1000); return m + ' min ' + String(s).padStart(2, '0') + ' s'; };
  const fmtDate = ts => new Date(ts).toLocaleString('es', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
  const LETTERS = 'ABCDEFGH';
  const level = p => p == null ? { t: 'Sin datos', c: 'var(--dim)' } : p >= 85 ? { t: 'Experto', c: 'var(--ok)' } : p >= 70 ? { t: 'Competente', c: 'color-mix(in oklab, var(--ok) 70%, var(--warn))' } : p >= 50 ? { t: 'En desarrollo', c: 'var(--warn)' } : { t: 'Inicial', c: 'var(--bad)' };
  const sameSet = (a, b) => a.length === b.length && a.slice().sort().join() === b.slice().sort().join();

  function history() { return store.get(K.hist, []); }
  function saveHistory(h) { return store.set(K.hist, h); }
  function coaches() {
    const map = new Map();
    history().forEach(a => {
      const k = coachKey(a.coach);
      if (!map.has(k)) map.set(k, { key: k, name: a.coach, attempts: [] });
      map.get(k).attempts.push(a);
    });
    map.forEach(c => { c.attempts.sort((x, y) => x.date - y.date); c.name = c.attempts[c.attempts.length - 1].coach; });
    return [...map.values()].sort((a, b) => b.attempts[b.attempts.length - 1].date - a.attempts[a.attempts.length - 1].date);
  }

  function modal(html, buttons) {
    return new Promise(res => {
      const bg = document.createElement('div');
      bg.className = 'modal-bg';
      bg.innerHTML = '<div class="modal" role="dialog" aria-modal="true">' + html + '<div class="row">' +
        buttons.map((b, i) => '<button class="btn ' + (b.cls || '') + '" data-i="' + i + '">' + esc(b.label) + '</button>').join('') + '</div></div>';
      document.body.appendChild(bg);
      const done = v => { bg.remove(); document.removeEventListener('keydown', onKey); res(v); };
      const onKey = e => { if (e.key === 'Escape') done(null); };
      document.addEventListener('keydown', onKey);
      bg.addEventListener('click', e => { if (e.target === bg) done(null); const i = e.target.dataset && e.target.dataset.i; if (i != null) done(buttons[+i].value); });
      const prim = bg.querySelector('.btn.primary'); if (prim) prim.focus();
    });
  }

  function setTop(html) { topbar.innerHTML = html || ''; }
  function stopTimer() { if (timerId) { clearInterval(timerId); timerId = null; } }

  /* ---------- selección de preguntas ---------- */
  // Reparte n parejo entre dimensiones (el resto va a dimensiones al azar) y, dentro de cada
  // dimensión, prefiere las preguntas que este coach vio menos veces.
  function buildExam(name, n) {
    const seen = Object.create(null);
    const ck = coachKey(name);
    history().filter(a => coachKey(a.coach) === ck).forEach(a => a.items.forEach(it => { seen[it.qid] = (seen[it.qid] || 0) + 1; }));

    const pools = {};
    DIMS.forEach(d => {
      pools[d.id] = shuffle(BANK.filter(q => q.d === d.id)).sort((a, b) => (seen[a.id] || 0) - (seen[b.id] || 0));
    });
    const quota = {}; DIMS.forEach(d => { quota[d.id] = 0; });
    let left = n;
    // Ronda por ronda, en orden aleatorio, una pregunta por dimensión mientras haya en el pool.
    while (left > 0) {
      let progressed = false;
      for (const d of shuffle(DIMS)) {
        if (left === 0) break;
        if (quota[d.id] < pools[d.id].length) { quota[d.id]++; left--; progressed = true; }
      }
      if (!progressed) break;
    }
    const picked = [];
    DIMS.forEach(d => picked.push(...pools[d.id].slice(0, quota[d.id])));
    const questions = shuffle(picked).map(q => ({ qid: q.id, order: shuffle(q.o.map((_, i) => i)) }));
    const now = Date.now();
    const durationMs = questions.length * SEC_PER_Q * 1000;
    return { id: uid(), coach: cleanName(name), startedAt: now, deadline: now + durationMs, durationMs, questions, answers: {}, flags: {}, pos: 0 };
  }

  /* ---------- EXAMEN ---------- */
  function persist() { if (exam) store.set(K.cur, exam); }

  function renderExam() {
    stopTimer();
    window.scrollTo(0, 0);
    setTop(`<span class="small muted coachname">${esc(exam.coach)}</span><span class="timer" id="timer">--:--</span><button class="btn sm primary" id="finishBtn">Finalizar</button>`);
    document.getElementById('finishBtn').onclick = confirmFinish;
    drawQuestion();
    tick();
    timerId = setInterval(tick, 1000);
  }

  function tick() {
    const el = document.getElementById('timer');
    if (!exam) return stopTimer();
    const left = exam.deadline - Date.now();
    if (el) {
      el.textContent = fmtClock(left);
      el.className = 'timer' + (left <= 60000 ? ' crit' : left <= 5 * 60000 ? ' warn' : '');
    }
    if (left <= 0) { stopTimer(); finish(true); }
  }

  function drawQuestion() {
    const i = exam.pos, item = exam.questions[i], q = BYID[item.qid];
    const total = exam.questions.length;
    const sel = exam.answers[i] || [];
    const multi = q.t === 'm', need = q.a.length;
    const answered = Object.keys(exam.answers).filter(k => (exam.answers[k] || []).length).length;

    app.innerHTML = `
      <div class="progress" style="margin-bottom:22px"><i style="width:${(answered / total * 100).toFixed(1)}%"></i></div>
      <div class="grid2" style="grid-template-columns: 1fr 260px; align-items:start" id="examGrid">
        <div class="card">
          <div class="qhead">
            <span class="eyebrow">Pregunta ${i + 1} de ${total}</span>
            <span class="spacer"></span>
            <span class="chip">${esc(DIM[q.d].short)}</span>
            <span class="chip acc">${multi ? 'Selecciona ' + need : 'Respuesta única'}</span>
          </div>
          <p class="qtext">${esc(q.q)}</p>
          <div class="opts" role="${multi ? 'group' : 'radiogroup'}">
            ${item.order.map((oi, k) => `<button class="opt ${multi ? 'multi' : 'single'} ${sel.includes(oi) ? 'sel' : ''}" data-oi="${oi}" role="${multi ? 'checkbox' : 'radio'}" aria-checked="${sel.includes(oi)}"><span class="key">${LETTERS[k]}</span><span>${esc(q.o[oi])}</span></button>`).join('')}
          </div>
          <div class="hint" id="hint">${multi ? `<span class="muted">${sel.length} de ${need} seleccionadas</span>` : ''}</div>
          <div class="navrow">
            <button class="btn" id="prev" ${i === 0 ? 'disabled' : ''}>← Anterior</button>
            <button class="btn ${exam.flags[i] ? 'on' : ''}" id="flag">${exam.flags[i] ? '★ Marcada' : '☆ Marcar para revisar'}</button>
            <span class="spacer"></span>
            ${i < total - 1 ? '<button class="btn primary" id="next">Siguiente →</button>' : '<button class="btn primary" id="end">Finalizar examen</button>'}
          </div>
        </div>
        <div class="card">
          <h3>Navegación</h3>
          <div class="small muted" style="margin-bottom:10px">${answered} de ${total} respondidas</div>
          <div class="qmap">${exam.questions.map((_, k) => `<button data-k="${k}" class="${(exam.answers[k] || []).length ? 'ans' : ''} ${k === i ? 'cur' : ''} ${exam.flags[k] ? 'flag' : ''}">${k + 1}</button>`).join('')}</div>
          <div class="legend"><span><i style="background:var(--panel2);border-color:var(--muted)"></i>Respondida</span><span><i style="background:var(--warn);border-color:var(--warn)"></i>Marcada</span></div>
          <div class="small muted" style="margin-top:14px">Atajos: A–${LETTERS[item.order.length - 1]} o 1–${item.order.length} para elegir, ← → para navegar.</div>
        </div>
      </div>`;
    if (window.matchMedia('(max-width: 760px)').matches) document.getElementById('examGrid').style.gridTemplateColumns = '1fr';

    app.querySelectorAll('.opt').forEach(b => { b.onclick = () => choose(+b.dataset.oi); });
    app.querySelectorAll('.qmap button').forEach(b => { b.onclick = () => go(+b.dataset.k); });
    document.getElementById('prev').onclick = () => go(i - 1);
    const nx = document.getElementById('next'); if (nx) nx.onclick = () => go(i + 1);
    const en = document.getElementById('end'); if (en) en.onclick = confirmFinish;
    document.getElementById('flag').onclick = () => { exam.flags[i] = !exam.flags[i]; if (!exam.flags[i]) delete exam.flags[i]; persist(); drawQuestion(); };
  }

  function choose(oi) {
    const i = exam.pos, q = BYID[exam.questions[i].qid];
    let sel = (exam.answers[i] || []).slice();
    if (q.t === 's') sel = [oi];
    else if (sel.includes(oi)) sel = sel.filter(x => x !== oi);
    else {
      if (sel.length >= q.a.length) {
        document.getElementById('hint').textContent = 'Ya seleccionaste ' + q.a.length + '. Quita una opción para elegir otra.';
        return;
      }
      sel.push(oi);
    }
    if (sel.length) exam.answers[i] = sel; else delete exam.answers[i];
    persist();
    drawQuestion();
  }

  function go(k) {
    if (k < 0 || k >= exam.questions.length) return;
    exam.pos = k; persist(); drawQuestion(); window.scrollTo(0, 0);
  }

  async function confirmFinish() {
    const total = exam.questions.length;
    const unanswered = exam.questions.filter((_, k) => !(exam.answers[k] || []).length).length;
    const partial = exam.questions.filter((it, k) => { const q = BYID[it.qid]; const s = exam.answers[k] || []; return q.t === 'm' && s.length && s.length < q.a.length; }).length;
    const flagged = Object.keys(exam.flags).length;
    const msgs = [];
    if (unanswered) msgs.push(`<b>${unanswered}</b> pregunta${unanswered > 1 ? 's' : ''} sin responder`);
    if (partial) msgs.push(`<b>${partial}</b> de selección múltiple incompleta${partial > 1 ? 's' : ''}`);
    if (flagged) msgs.push(`<b>${flagged}</b> marcada${flagged > 1 ? 's' : ''} para revisar`);
    const ok = await modal(`<h2>¿Finalizar el examen?</h2><p class="muted">${msgs.length ? 'Tienes ' + msgs.join(', ') + '. ' : 'Respondiste las ' + total + ' preguntas. '}Una vez entregado no podrás modificar las respuestas.</p>`,
      [{ label: 'Seguir respondiendo', value: false, cls: 'ghost' }, { label: 'Entregar', value: true, cls: 'primary' }]);
    if (ok) finish(false);
  }

  function finish(timedOut) {
    stopTimer();
    if (!exam) return;
    const byDim = {};
    DIMS.forEach(d => { byDim[d.id] = { c: 0, t: 0 }; });
    let correct = 0;
    const items = exam.questions.filter(it => BYID[it.qid]).map((it, k) => {
      const q = BYID[it.qid];
      const sel = exam.answers[exam.questions.indexOf(it)] || [];
      const ok = sameSet(sel, q.a);
      byDim[q.d].t++; if (ok) { byDim[q.d].c++; correct++; }
      return { qid: it.qid, order: it.order, sel, ok };
    });
    const now = Math.min(Date.now(), exam.deadline);
    const attempt = {
      id: exam.id, coach: exam.coach, date: Date.now(), startedAt: exam.startedAt,
      durationMs: exam.durationMs, usedMs: Math.max(0, now - exam.startedAt),
      total: items.length, correct, pct: items.length ? Math.round(correct / items.length * 100) : 0,
      byDim, items, timedOut: !!timedOut
    };
    const h = history();
    if (!h.some(a => a.id === attempt.id)) h.push(attempt);
    const saved = saveHistory(h);
    store.del(K.cur);
    exam = null;
    reviewFilter = { kind: 'all', dim: 'all' };
    renderResults(attempt, { fresh: true, saved });
  }

  /* ---------- GRÁFICOS ---------- */
  function radarSVG(byDim) {
    const dims = DIMS.filter(d => byDim[d.id] && byDim[d.id].t > 0);
    if (dims.length < 3) return '';
    const W = 540, H = 380, cx = W / 2, cy = H / 2 + 4, R = 128, n = dims.length;
    const ang = k => -Math.PI / 2 + k * 2 * Math.PI / n;
    const P = (k, r) => [cx + Math.cos(ang(k)) * r, cy + Math.sin(ang(k)) * r];
    let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Gráfico radar de resultados por dimensión">`;
    [25, 50, 75, 100].forEach(p => {
      s += `<polygon class="grid" points="${dims.map((_, k) => P(k, R * p / 100).join(',')).join(' ')}" ${p === 100 ? '' : 'stroke-dasharray="2 3"'}/>`;
    });
    // Línea de aprobación
    s += `<polygon points="${dims.map((_, k) => P(k, R * PASS / 100).join(',')).join(' ')}" fill="none" stroke="var(--muted)" stroke-width="1" stroke-dasharray="5 4" opacity=".8"/>`;
    dims.forEach((_, k) => { const [x, y] = P(k, R); s += `<line class="grid" x1="${cx}" y1="${cy}" x2="${x}" y2="${y}"/>`; });
    const pts = dims.map((d, k) => P(k, R * byDim[d.id].c / byDim[d.id].t));
    s += `<polygon class="area" points="${pts.map(p => p.join(',')).join(' ')}"/>`;
    pts.forEach(p => { s += `<circle class="pt" cx="${p[0]}" cy="${p[1]}" r="3.5"/>`; });
    dims.forEach((d, k) => {
      const [x, y] = P(k, R + 22);
      const c = Math.cos(ang(k));
      const anchor = Math.abs(c) < 0.2 ? 'middle' : c > 0 ? 'start' : 'end';
      const pct = Math.round(byDim[d.id].c / byDim[d.id].t * 100);
      s += `<text x="${x}" y="${y}" text-anchor="${anchor}" dominant-baseline="middle" style="font-size:11px;fill:var(--fg)">${esc(d.short)}</text>`;
      s += `<text x="${x}" y="${y + 13}" text-anchor="${anchor}" dominant-baseline="middle">${pct}%</text>`;
    });
    s += `<text x="${cx + 4}" y="${cy - R * PASS / 100 - 4}" style="font-size:9px">${PASS}%</text>`;
    return s + '</svg>';
  }

  function barsHTML(byDim) {
    return '<div class="bars">' + DIMS.map(d => {
      const v = byDim[d.id] || { c: 0, t: 0 };
      const pct = v.t ? Math.round(v.c / v.t * 100) : null;
      const lv = level(pct);
      return `<div class="bar"><div class="lbl"><span>${esc(d.name)}</span><span class="mono small"><span style="color:${lv.c}">${lv.t}</span> · ${v.t ? v.c + '/' + v.t + ' · ' + pct + '%' : '—'}</span></div>
        <div class="track"><i style="width:${pct || 0}%;background:${lv.c}"></i></div></div>`;
    }).join('') + `<div class="small muted">La línea vertical marca el ${PASS}% de aprobación. Niveles: Inicial &lt;50% · En desarrollo 50–69% · Competente 70–84% · Experto ≥85%.</div></div>`;
  }

  function lineSVG(attempts) {
    const W = 640, H = 220, L = 36, Rm = 16, T = 14, B = 30;
    const n = attempts.length;
    const x = k => n === 1 ? (L + (W - L - Rm) / 2) : L + k * (W - L - Rm) / (n - 1);
    const y = p => T + (100 - p) * (H - T - B) / 100;
    let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Evolución del puntaje">`;
    [0, 25, 50, 75, 100].forEach(p => { s += `<line class="grid" x1="${L}" x2="${W - Rm}" y1="${y(p)}" y2="${y(p)}" ${p ? 'stroke-dasharray="2 3"' : ''}/><text x="${L - 6}" y="${y(p)}" text-anchor="end" dominant-baseline="middle">${p}</text>`; });
    s += `<line x1="${L}" x2="${W - Rm}" y1="${y(PASS)}" y2="${y(PASS)}" stroke="var(--muted)" stroke-dasharray="5 4"/><text x="${W - Rm}" y="${y(PASS) - 5}" text-anchor="end" style="font-size:9px">aprobación ${PASS}%</text>`;
    if (n > 1) s += `<polyline fill="none" stroke="var(--accent)" stroke-width="2" points="${attempts.map((a, k) => x(k) + ',' + y(a.pct)).join(' ')}"/>`;
    attempts.forEach((a, k) => {
      s += `<circle cx="${x(k)}" cy="${y(a.pct)}" r="4" fill="${a.pct >= PASS ? 'var(--ok)' : 'var(--bad)'}"><title>${esc(fmtDate(a.date))}: ${a.pct}%</title></circle>`;
      if (n <= 12 || k % Math.ceil(n / 12) === 0) s += `<text x="${x(k)}" y="${H - 10}" text-anchor="middle">#${k + 1}</text>`;
    });
    return s + '</svg>';
  }

  /* ---------- RESULTADOS ---------- */
  function renderResults(a, opts) {
    opts = opts || {};
    stopTimer();
    window.scrollTo(0, 0);
    setTop(`<button class="btn ghost sm" id="tHome">Inicio</button><button class="btn ghost sm" id="tHist">Historial</button><button class="btn ghost sm" id="tPrint">Imprimir</button>`);
    document.getElementById('tHome').onclick = renderHome;
    document.getElementById('tHist').onclick = () => renderHistory(coachKey(a.coach));
    document.getElementById('tPrint').onclick = () => window.print();

    const pass = a.pct >= PASS;
    const dimsSorted = DIMS.filter(d => a.byDim[d.id] && a.byDim[d.id].t).map(d => ({ d, p: a.byDim[d.id].c / a.byDim[d.id].t })).sort((x, y) => y.p - x.p);
    const strong = dimsSorted.filter(x => x.p >= 0.7).slice(0, 3);
    const weak = dimsSorted.filter(x => x.p < 0.7).reverse().slice(0, 3);
    const radar = radarSVG(a.byDim);

    app.innerHTML = `
      ${opts.fresh && a.timedOut ? '<div class="banner"><b>Tiempo agotado.</b>&nbsp;El examen se entregó automáticamente con las respuestas registradas.</div>' : ''}
      ${opts.fresh && opts.saved === false ? '<div class="banner"><b>Atención:</b>&nbsp;no se pudo guardar en el almacenamiento local del navegador. Imprime o anota el resultado.</div>' : ''}
      <div class="eyebrow">Resultado · ${esc(fmtDate(a.date))}</div>
      <h1>${esc(a.coach)}</h1>
      <div class="card">
        <div class="score">
          <div><div class="pct mono">${a.pct}%</div></div>
          <div style="padding-bottom:8px"><span class="verdict ${pass ? 'pass' : 'fail'}">${pass ? 'Aprobado' : 'No aprobado'}</span>
          <div class="small muted" style="margin-top:8px">Nivel general: <b style="color:${level(a.pct).c}">${level(a.pct).t}</b></div></div>
        </div>
        <div class="kv">
          <div><span class="small muted">Correctas</span><b>${a.correct} / ${a.total}</b></div>
          <div><span class="small muted">Incorrectas</span><b>${a.total - a.correct}</b></div>
          <div><span class="small muted">Sin responder</span><b>${a.items.filter(i => !i.sel.length).length}</b></div>
          <div><span class="small muted">Tiempo usado</span><b>${fmtDur(a.usedMs)}</b></div>
          <div><span class="small muted">Tiempo disponible</span><b>${Math.round(a.durationMs / 60000)} min</b></div>
        </div>
        ${strong.length || weak.length ? `<div class="grid2" style="margin-top:18px;grid-template-columns:1fr 1fr">
          <div><div class="eyebrow" style="margin-bottom:6px">Fortalezas</div>${strong.length ? strong.map(x => `<div class="small">${esc(x.d.name)} · <span class="mono">${Math.round(x.p * 100)}%</span></div>`).join('') : '<div class="small muted">Ninguna dimensión alcanzó el ' + PASS + '%.</div>'}</div>
          <div><div class="eyebrow" style="margin-bottom:6px">A desarrollar</div>${weak.length ? weak.map(x => `<div class="small">${esc(x.d.name)} · <span class="mono">${Math.round(x.p * 100)}%</span></div>`).join('') : '<div class="small muted">Todas las dimensiones superan el ' + PASS + '%.</div>'}</div>
        </div>` : ''}
      </div>
      <div class="grid2" style="margin-top:16px">
        <div class="card"><h2>Resultado por dimensión</h2>${barsHTML(a.byDim)}</div>
        <div class="card"><h2>Perfil de competencias</h2>${radar ? `<div class="chart-wrap">${radar}</div>` : '<div class="empty">Se necesitan al menos 3 dimensiones evaluadas para el radar.</div>'}</div>
      </div>
      <div class="card" style="margin-top:16px">
        <h2>Revisión de respuestas</h2>
        <div class="filters" id="filters"></div>
        <div id="revList"></div>
      </div>
      <div class="row noprint" style="margin-top:20px"><button class="btn" id="bHome">Volver al inicio</button><button class="btn" id="bHist">Ver historial del coach</button></div>`;

    document.getElementById('bHome').onclick = renderHome;
    document.getElementById('bHist').onclick = () => renderHistory(coachKey(a.coach));
    drawReview(a);
  }

  function drawReview(a) {
    const f = reviewFilter;
    const nOk = a.items.filter(i => i.ok).length;
    const fEl = document.getElementById('filters');
    fEl.innerHTML = `
      <button class="btn sm ${f.kind === 'all' ? 'act' : ''}" data-kind="all">Todas (${a.items.length})</button>
      <button class="btn sm ${f.kind === 'bad' ? 'act' : ''}" data-kind="bad">Incorrectas (${a.items.length - nOk})</button>
      <button class="btn sm ${f.kind === 'ok' ? 'act' : ''}" data-kind="ok">Correctas (${nOk})</button>
      <span class="spacer"></span>
      <select id="dimSel" aria-label="Filtrar por dimensión"><option value="all">Todas las dimensiones</option>${DIMS.filter(d => a.byDim[d.id] && a.byDim[d.id].t).map(d => `<option value="${d.id}" ${f.dim === d.id ? 'selected' : ''}>${esc(d.name)}</option>`).join('')}</select>`;
    fEl.querySelectorAll('[data-kind]').forEach(b => { b.onclick = () => { reviewFilter.kind = b.dataset.kind; drawReview(a); }; });
    document.getElementById('dimSel').onchange = e => { reviewFilter.dim = e.target.value; drawReview(a); };

    const list = a.items.map((it, n) => ({ it, n, q: BYID[it.qid] }))
      .filter(x => x.q)
      .filter(x => f.kind === 'all' || (f.kind === 'ok') === x.it.ok)
      .filter(x => f.dim === 'all' || x.q.d === f.dim);

    document.getElementById('revList').innerHTML = list.length ? list.map(({ it, n, q }) => {
      const multi = q.t === 'm';
      const opts = it.order.map((oi, k) => {
        const isC = q.a.includes(oi), isS = it.sel.includes(oi);
        const cls = isC ? 'correct' : isS ? 'wrong' : '';
        const mark = isC ? '✓' : isS ? '✗' : '';
        const tag = isS && isC ? 'tu respuesta · correcta' : isS ? 'tu respuesta' : isC ? 'correcta' : '';
        return `<li class="${cls}"><span class="m">${mark}</span><span><b class="mono">${LETTERS[k]}.</b> ${esc(q.o[oi])}</span>${tag ? `<span class="tag">${tag}</span>` : ''}</li>`;
      }).join('');
      return `<div class="rev ${it.ok ? 'ok' : 'bad'}">
        <div class="row"><span class="mono small muted">#${n + 1}</span><span class="chip ${it.ok ? 'ok' : 'bad'}">${it.ok ? 'Correcta' : it.sel.length ? 'Incorrecta' : 'Sin responder'}</span><span class="chip">${esc(DIM[q.d].short)}</span>${multi ? `<span class="chip">Múltiple · ${q.a.length}</span>` : ''}</div>
        <div class="q">${esc(q.q)}</div>
        <ul>${opts}</ul>
        <div class="expl"><b>Explicación.</b> ${esc(q.e)}</div>
      </div>`;
    }).join('') : '<div class="empty">No hay preguntas con este filtro.</div>';
  }

  /* ---------- HISTORIAL ---------- */
  function renderHistory(selKey) {
    stopTimer();
    window.scrollTo(0, 0);
    setTop('<button class="btn ghost sm" id="tHome">Inicio</button>');
    document.getElementById('tHome').onclick = renderHome;
    const list = coaches();
    if (!selKey && list.length) selKey = list[0].key;
    const sel = list.find(c => c.key === selKey);

    let detail = '';
    if (sel) {
      const at = sel.attempts;
      const agg = {}; DIMS.forEach(d => { agg[d.id] = { c: 0, t: 0 }; });
      at.forEach(a => DIMS.forEach(d => { if (a.byDim[d.id]) { agg[d.id].c += a.byDim[d.id].c; agg[d.id].t += a.byDim[d.id].t; } }));
      const best = Math.max(...at.map(a => a.pct));
      const avg = Math.round(at.reduce((s, a) => s + a.pct, 0) / at.length);
      const radar = radarSVG(agg);
      detail = `
        <div class="card" style="margin-top:16px">
          <div class="row"><div><div class="eyebrow">Coach</div><h2 style="margin:4px 0 0">${esc(sel.name)}</h2></div><div class="spacer"></div>
            <button class="btn sm" id="newFor">Nuevo examen para ${esc(sel.name)}</button></div>
          <div class="kv">
            <div><span class="small muted">Intentos</span><b>${at.length}</b></div>
            <div><span class="small muted">Último</span><b>${at[at.length - 1].pct}%</b></div>
            <div><span class="small muted">Mejor</span><b>${best}%</b></div>
            <div><span class="small muted">Promedio</span><b>${avg}%</b></div>
            <div><span class="small muted">Aprobados</span><b>${at.filter(a => a.pct >= PASS).length}</b></div>
          </div>
        </div>
        <div class="card"><h2>Evolución del puntaje</h2><div class="chart-wrap">${lineSVG(at)}</div></div>
        <div class="grid2" style="margin-top:16px">
          <div class="card"><h2>Acumulado por dimensión</h2><div class="small muted" style="margin:-6px 0 12px">Suma de todas las preguntas respondidas en todos los intentos.</div>${barsHTML(agg)}</div>
          <div class="card"><h2>Perfil acumulado</h2>${radar ? `<div class="chart-wrap">${radar}</div>` : '<div class="empty">Datos insuficientes.</div>'}</div>
        </div>
        <div class="card"><h2>Intentos</h2><div class="tscroll"><table>
          <thead><tr><th>#</th><th>Fecha</th><th>Preguntas</th><th>Puntaje</th><th>Tiempo</th><th>Estado</th><th></th></tr></thead>
          <tbody>${at.map((a, k) => `<tr>
            <td class="mono">${k + 1}</td><td>${esc(fmtDate(a.date))}</td><td class="mono">${a.correct}/${a.total}</td>
            <td class="mono" style="color:${level(a.pct).c}"><b>${a.pct}%</b></td><td class="mono small">${fmtDur(a.usedMs)}${a.timedOut ? ' ⏱' : ''}</td>
            <td><span class="verdict ${a.pct >= PASS ? 'pass' : 'fail'}" style="font-size:10px;padding:3px 6px">${a.pct >= PASS ? 'Aprobado' : 'No aprobado'}</span></td>
            <td style="white-space:nowrap"><button class="btn sm" data-view="${esc(a.id)}">Ver detalle</button> <button class="btn sm danger ghost" data-del="${esc(a.id)}" title="Eliminar intento">✕</button></td></tr>`).join('')}</tbody>
        </table></div></div>`;
    }

    app.innerHTML = `
      <div class="eyebrow">Historial</div>
      <h1>Historial por coach</h1>
      <div class="row noprint" style="margin-bottom:16px">
        <button class="btn sm" id="exp" ${list.length ? '' : 'disabled'}>Exportar historial (JSON)</button>
        <label class="btn sm" style="cursor:pointer">Importar historial<input type="file" id="imp" accept="application/json,.json" class="hide"></label>
        <span class="small muted">El historial vive en el almacenamiento local de este navegador; exporta una copia para respaldarlo o pasarlo a otro equipo.</span>
      </div>
      ${list.length ? `<div class="coachgrid">${list.map(c => { const l = c.attempts[c.attempts.length - 1]; return `<button class="coachcard ${c.key === selKey ? 'act' : ''}" data-k="${esc(c.key)}"><b>${esc(c.name)}</b><span class="small muted">${c.attempts.length} intento${c.attempts.length > 1 ? 's' : ''} · último ${l.pct}% · ${esc(new Date(l.date).toLocaleDateString('es'))}</span></button>`; }).join('')}</div>` : '<div class="empty">Todavía no hay exámenes registrados.</div>'}
      ${detail}`;

    app.querySelectorAll('.coachcard').forEach(b => { b.onclick = () => renderHistory(b.dataset.k); });
    const nf = document.getElementById('newFor');
    if (nf) nf.onclick = () => { store.set(K.last, { name: sel.name, n: (store.get(K.last, {}).n) || 20 }); renderHome(); };
    app.querySelectorAll('[data-view]').forEach(b => { b.onclick = () => { const a = history().find(x => x.id === b.dataset.view); if (a) { reviewFilter = { kind: 'all', dim: 'all' }; renderResults(a); } }; });
    app.querySelectorAll('[data-del]').forEach(b => {
      b.onclick = async () => {
        const ok = await modal('<h2>Eliminar intento</h2><p class="muted">El intento se borrará del historial de forma permanente.</p>', [{ label: 'Cancelar', value: false, cls: 'ghost' }, { label: 'Eliminar', value: true, cls: 'primary' }]);
        if (!ok) return;
        saveHistory(history().filter(a => a.id !== b.dataset.del));
        renderHistory(coaches().some(c => c.key === selKey) ? selKey : undefined);
      };
    });
    document.getElementById('exp').onclick = () => {
      const blob = new Blob([JSON.stringify({ app: 'agile-coach-assessment', version: 1, exportedAt: new Date().toISOString(), history: history() }, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url; link.download = 'agile-coach-historial-' + new Date().toISOString().slice(0, 10) + '.json';
      document.body.appendChild(link); link.click(); link.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    };
    document.getElementById('imp').onchange = e => {
      const file = e.target.files[0]; if (!file) return;
      const r = new FileReader();
      r.onload = async () => {
        let added = 0;
        try {
          const data = JSON.parse(r.result);
          const incoming = Array.isArray(data) ? data : data.history;
          if (!Array.isArray(incoming)) throw new Error('formato');
          const h = history(); const ids = new Set(h.map(a => a.id));
          incoming.forEach(a => {
            if (a && a.id && a.coach && Array.isArray(a.items) && a.byDim && !ids.has(a.id)) { h.push(a); ids.add(a.id); added++; }
          });
          saveHistory(h);
          await modal(`<h2>Importación completa</h2><p class="muted">Se agregaron ${added} intento${added === 1 ? '' : 's'} nuevo${added === 1 ? '' : 's'}.</p>`, [{ label: 'Aceptar', value: true, cls: 'primary' }]);
        } catch (err) {
          await modal('<h2>No se pudo importar</h2><p class="muted">El archivo no tiene el formato de historial esperado.</p>', [{ label: 'Aceptar', value: true, cls: 'primary' }]);
        }
        renderHistory(selKey);
      };
      r.readAsText(file);
    };
  }

  /* ---------- teclado ---------- */
  document.addEventListener('keydown', e => {
    if (!exam || document.querySelector('.modal-bg')) return;
    if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT')) return;
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    const item = exam.questions[exam.pos];
    if (e.key === 'ArrowRight') { go(exam.pos + 1); e.preventDefault(); return; }
    if (e.key === 'ArrowLeft') { go(exam.pos - 1); e.preventDefault(); return; }
    let k = -1;
    if (/^[1-8]$/.test(e.key)) k = +e.key - 1;
    else if (/^[a-h]$/i.test(e.key)) k = LETTERS.indexOf(e.key.toUpperCase());
    if (k >= 0 && k < item.order.length) { choose(item.order[k]); e.preventDefault(); }
  });

  /* ---------- tema ---------- */
  function applyTheme(t) { if (t) document.documentElement.setAttribute('data-theme', t); else document.documentElement.removeAttribute('data-theme'); }
  let theme = store.get(K.theme, null) || (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
  applyTheme(theme);
  document.getElementById('themeBtn').onclick = () => { theme = theme === 'light' ? 'dark' : 'light'; applyTheme(theme); store.set(K.theme, theme); };
  document.getElementById('brand').onclick = async () => {
    if (exam) {
      const ok = await modal('<h2>Salir del examen</h2><p class="muted">El examen queda guardado y el reloj sigue corriendo. Podrás continuarlo desde el inicio.</p>', [{ label: 'Quedarme', value: false, cls: 'ghost' }, { label: 'Ir al inicio', value: true, cls: 'primary' }]);
      if (!ok) return;
    }
    renderHome();
  };

  /* ---------- arranque ---------- */
  const cur = store.get(K.cur, null);
  if (cur && cur.questions && cur.questions.every(it => BYID[it.qid])) {
    exam = cur;
    if (exam.deadline <= Date.now()) finish(true); else renderExam();
  } else {
    if (cur) store.del(K.cur);
    renderHome();
  }
})();
</script>
</body>
</html>
